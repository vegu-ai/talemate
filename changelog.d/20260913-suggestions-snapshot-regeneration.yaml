fixed:
- "Fixed empty character-progress proposal entries, stale character selection, and Apply all failing to apply changes. Applying or discarding proposals preserves other characters' pending changes. Blank or unfinished content updates cannot erase attributes or descriptions; explicit attribute removals remain available."
- "Regenerating a pinned world snapshot's source message now restores one verified earlier snapshot, or clears it with a notice when none exists. Failed or cancelled regeneration restores the original snapshot. Snapshot provenance and the single previous revision are saved with the scene; obsolete in-flight responses are rejected. No additional automatic model request is made."
- "Snapshot refreshes and manual additions track the history actually supplied after memory lookup, including messages arriving during lookup. Excluded Director messages no longer invalidate snapshot results. Manual additions during message regeneration show a wait notice."
- "Malformed character-proposal attribute names no longer break the Suggestions panel; valid proposals can still be applied and malformed ones discarded. Incompatible world snapshot prompt overrides now show an actionable update/reset notice instead of silently discarding their results."
- "Unreleased snapshot metadata now stays together during scene reconstruction, including places, perspectives, highlight anchors, provenance, and the retained revision. Provenance replaces the old live-history length with input message IDs and its Director dependency; no migration is provided."
