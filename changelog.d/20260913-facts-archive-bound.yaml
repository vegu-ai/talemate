added:
- "Facts now name the line of the chapter they came from. Each fact keeps that line's presence and scene time, Source message opens the line, and the extraction links a repeated statement to the recorded fact it restates instead of saving it again."
changed:
- "Facts come from chapter summaries only. The per-line extraction (Establish facts from dialogue and the Refresh facts extraction for a line outside every chapter) is gone; Track learning from dialogue keeps granting recorded facts. A line still in the live history has no facts until its chapter is summarized. Extract facts is on at every effort stop above Off, and Off leaves it as it is."
- "A fact follows its line: deleting the line removes the fact (a hand-granted or author-edited fact stays, unbound; a Wipe history removes a fact that only a hand grant keeps), editing the line marks it out of date until the chapter is refreshed (with Extract facts off and Track learning from dialogue on, a character line's facts stay bound to the edited text; with both off, or for a narrator line, the edit removes the stale chapter and its facts), and editing, inserting or deleting an earlier time passage moves the fact's time with the timeline. The origin of a fact is always its earliest source, with that source's presence and time: regenerating a later chapter first does not move it, and when the line of origin is deleted the earliest remaining line that restated the fact becomes its origin."
- "Unknown recent facts always consider facts that name the character or were recorded while the character was away, ahead of the recent-facts window; the scene analysis lists what the character does not know first and marks such items as unknown to them."
- "The character awareness overview names each character once, in one bucket, with one clause per name."
- "The History tab lists facts under their chapter only; the Dialogue facts card is gone and every fact is in the Facts tab."
removed:
- "Facts saved by the earlier development builds without a line (dialogue facts, facts extracted from character views of single lines, and chapter facts without a line) are dropped when the scene loads; regenerate a chapter's facts to rebuild them. No migration is provided."
