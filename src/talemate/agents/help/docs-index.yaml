- path: dev/templates.md
  title: Template Overrides
  summary: 'Older reference for Talemate''s Jinja2 prompt templates: section tags, overriding a default by dropping a same-named
    file into ./templates/prompts/{agent}/, the creator naming convention, extending with {% extends %} and blocks, and the
    Jinja helpers.'
- path: dev/third-party-reference.md
  title: Third Party API docs
  summary: Bare link list to the upstream chat-completion API references for Anthropic, Cohere, Google AI, Groq, KoboldCpp,
    LMStudio, Mistral AI, OpenAI, TabbyAPI and Text-Generation-WebUI.
- path: getting-started/advanced/change-host-and-port.md
  title: Changing host and port
  summary: Changing the backend (localhost:5050) and frontend (localhost:8082) bind addresses via TALEMATE_BACKEND_HOST/PORT
    and TALEMATE_FRONTEND_HOST/PORT or the --host/--port CLI flags, rebuilding the frontend with VITE_TALEMATE_BACKEND_WEBSOCKET_URL,
    Docker Compose runtime overrides with CUDA/CPU file selection, and the 0.37.0 rename notes.
- path: getting-started/advanced/debug-logging.md
  title: Debug Logging
  summary: Set TALEMATE_DEBUG=1 before starting the server to switch from INFO to DEBUG logging and write errors to logs/errors.log
    (rotating). Gives the Linux prefix and Windows SET syntax for enabling and disabling it.
- path: getting-started/advanced/environment-variables.md
  title: Environment variables
  summary: 'Reference table of every environment variable Talemate reads: TALEMATE_BACKEND_HOST/PORT, TALEMATE_FRONTEND_HOST/PORT,
    VITE_TALEMATE_BACKEND_WEBSOCKET_URL, TALEMATE_DEBUG, TALEMATE_LOG_PROMPTS, TALEMATE_PI_BRIDGE_TRACE, TALEMATE_DISABLE_KEYRING,
    TALEMATE_ENCRYPTION_KEY_DIR and the Docker Compose passthroughs.'
- path: getting-started/advanced/prompt-logging.md
  title: Prompt Logging
  summary: Set TALEMATE_LOG_PROMPTS=1 to append every prompt and response to logs/prompt_log.jsonl. Documents the record schema
    - kind, prompt, response, token counts, client_name, agent_stack, generation_parameters, inference_preset, reasoning,
    template_uid.
- path: getting-started/connect-a-client.md
  title: Connect a client
  summary: 'Adding an LLM client and assigning agents. Client types: OpenAI, Anthropic, Mistral, Cohere, DeepSeek, Groq, Gemini,
    OpenRouter, Pi Bridge, KoboldCpp, llama.cpp, Ollama, Text-Generation-WebUI, LMStudio, TabbyAPI.'
- path: getting-started/installation/docker.md
  title: Docker
  summary: 'Docker installation and GPU/CPU launch paths: clone and copy config.yaml, then use docker compose up for NVIDIA
    CUDA or docker compose -f docker-compose.cpu.yml up on CPU-only hosts. Covers local builds with docker-compose.manual.yml,
    CUDA verification with nvidia-smi/PyTorch, host.docker.internal, and Pi Bridge config.'
- path: getting-started/installation/linux.md
  title: Linux
  summary: 'Linux install: python plus uv, then clone, ''source install.sh'' (optionally with CUDA pytorch) and ''source start.sh'';
    install.sh downloads a portable Node.js 22. Also the manual path - uv venv, uv pip install -e ''.[dev]'', run.py runserver
    and corepack pnpm.'
- path: getting-started/installation/troubleshoot.md
  title: Common issues
  summary: Troubleshooting Windows install paths, Docker CUDA startup failures, and reverse-proxy WebSockets. Shows the CPU
    opt-out command, NVIDIA Container Toolkit smoke test, in-container nvidia-smi/PyTorch checks, the config.yaml mount pitfall,
    VITE WebSocket URL, and nginx upgrade headers.
- path: getting-started/installation/windows.md
  title: Windows
  summary: 'Windows install: extract the release ZIP and double-click start.bat, which downloads portable Python 3 and Node.js
    22, creates the venv, installs backend and frontend dependencies with uv and pnpm, and builds the web client. Lists install.bat,
    install-cuda.bat and update.bat.'
- path: getting-started/load-a-scene.md
  title: Load a scenario
  summary: 'First-play walkthrough: load the Infinity Quest demo from Quick load on the Home screen (first load downloads
    the long-term memory model), send a message using quotes for speech and asterisks for actions, then tour the scene tools
    and world state panel.'
- path: getting-started/setup-wizard.md
  title: Setup Wizard
  summary: 'The first-launch wizard: pick a self-hosted client (KoboldCpp, Text-Generation-WebUI, llama.cpp, LMStudio, TabbyAPI)
    or hosted API (OpenRouter, Google, Anthropic), then set up memory embeddings and the Visual agent.'
- path: index.md
  title: Talemate Documentation
  summary: Documentation landing page - one-line description of Talemate plus links to the Windows, Linux and Docker installation
    pages and the first-steps pages (Setup Wizard, Connect a client, Load a scene, Interact with the scene).
- path: user-guide/agents/conversation/index.md
