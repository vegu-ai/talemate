    Cohere, Groq, Google) and local (KoboldCpp, llama.cpp, Text-Generation-WebUI, LMStudio) client types.
- path: user-guide/clients/model-testing-harness.md
  title: Model Testing Harness
  summary: 'Bundled scene (0.37.0+) that runs six minimum-viability tests against the clients assigned to your agents: instruction
    following, JSON/YAML data responses, conversation and narrative generation, FOCAL function calling, and multi-step problem
    solving. Explains how to load it, read pass/fail results, and diagnose which client setting is broken.'
- path: user-guide/clients/presets.md
  title: Inference Configuration
  summary: 'Editing inference presets (Analytical, Conversation, Creative, Deterministic, Scene Direction, Summarization,
    etc.) in App Settings: parameters like temperature, top-p/k, min-p, penalties, and advanced samplers (XTC, DRY, Smoothing,
    Adaptive-P), per-client parameter support, the Apply-to-all and Reset actions, and creating custom preset groups assigned
    per client.'
- path: user-guide/clients/prompt-templates.md
  title: Prompt Templates
  summary: 'Why the correct prompt template is vital for local clients (KoboldCpp, llama.cpp, Text-Generation-WebUI, LMStudio,
    TabbyAPI): the yellow-triangle warning for unset templates, automatic detection via HuggingFace, manual selection, and
    where user templates are stored.'
- path: user-guide/clients/rate-limiting.md
  title: Rate Limiting
  summary: 'Capping a client to N requests per minute via the slider on the Advanced tab, and what happens when the limit
    is hit: a popup where you can wait for the countdown or abort the generation.'
- path: user-guide/clients/reasoning.md
  title: Reasoning Model Support
  summary: 'Enabling reasoning (thinking) models per client: the Reasoning tab, Reasoning Tokens allocation and how it behaves
    on APIs without native support, regex patterns to strip thinking from responses, Pattern Not Found behavior, and per-action
    overrides to force reasoning off for individual agent actions via the prompt detail view.'
- path: user-guide/clients/recommended-models.md
  title: Recommended Local Models
  summary: Talemate no longer maintains a model list; points to external benchmarks, advises 7B minimum (unquantized for 7B/8B
    if possible), and suggests validating candidates with the Model Testing Harness.
- path: user-guide/clients/response-length.md
  title: Response Length Enforcement
  summary: 'The Response Length Enforcement setting on the Advanced tab: four modes combining token-budget capping (max_tokens)
    and human-readable length instructions appended to prompts, including the token-to-paragraph instruction table and the
    not-recommended Uncapped mode.'
- path: user-guide/clients/section-format.md
  title: Section Format
  summary: 'Per-client setting (0.37.0+) that controls how prompt sections like Characters/Scene/Task are delimited: Markdown
    headings versus paired uppercase XML tags, where to change it on the Advanced tab, and the sidebar tag shown for non-default
    values.'
- path: user-guide/clients/template-locking.md
  title: Template Locking
  summary: Using the Lock Template checkbox to prevent a client's prompt template from auto-updating when the model changes
    — useful for pinning reasoning vs non-reasoning template variants — with step-by-step lock and unlock instructions.
- path: user-guide/clients/types/anthropic.md
  title: Anthropic Client
  summary: 'Adding an Anthropic client: setting the client type, entering the Anthropic API key via SET API KEY, and the Client
    Name and Model settings (any model id can be typed manually if the list lags behind).'
- path: user-guide/clients/types/cohere.md
  title: Cohere Client
  summary: 'Adding a Cohere client: setting the client type, entering the Cohere API key, and the Client Name and Model settings
    (defaults to command-r-plus; manual model names accepted).'
- path: user-guide/clients/types/deepseek.md
  title: DeepSeek Client
  summary: Adding a DeepSeek client and API key, choosing between deepseek-chat and deepseek-reasoner, and the requirement
    to enable Reasoning with sufficient Reasoning Tokens (512-1024+) when using deepseek-reasoner to avoid empty responses.
- path: user-guide/clients/types/google.md
  title: Google Client
  summary: 'Adding a Google Gemini client: setting up Google Cloud API credentials, Client Name and Model settings, and the
    Disable Safety Settings option to turn off Google''s harmful-content response validation.'
- path: user-guide/clients/types/groq.md
  title: Groq Client
  summary: 'Adding a Groq client: setting the client type, entering the Groq API key, and the Client Name and Model settings
    (defaults to llama3-70b-8192; manual model names accepted).'
- path: user-guide/clients/types/koboldcpp.md
  title: KoboldCpp Client
  summary: 'Connecting to a KoboldCpp instance: API URL (United API by default, append /v1 for OpenAI mode), API key, context
    length, the full table of United-API sampler parameters (XTC, DRY, Smoothing, Adaptive-P, etc.), automatic Visual agent
    and TTS/Voice agent auto-setup when Kobold loads image or TTS models, and connection troubleshooting.'
- path: user-guide/clients/types/llamacpp.md
  title: llama.cpp Client
  summary: 'Connecting to a llama-server instance: API URL (default port 8080), optional API key, the ''API handles prompt
    template'' option (renders prompts via the server''s /apply-template endpoint using the model''s built-in chat template;
    response pre-filling keeps working), context length, and the Concurrent Inference toggle (requires parallel slots on
    the server). Includes could-not-connect troubleshooting and a sample llama-server launch command.'
- path: user-guide/clients/types/lmstudio.md
  title: LMStudio Client
  summary: 'Connecting to an LMStudio instance: API URL (default port 1234), API key, and context length settings, plus the
    gotcha that the server must be started inside the LMStudio app for connections to work.'
- path: user-guide/clients/types/mistral.md
  title: Mistral.ai Client
  summary: 'Adding a Mistral.ai client: setting the client type, entering the Mistral.ai API key, and the Client Name and
    Model settings (defaults to mixtral-8x22; manual model names accepted).'
- path: user-guide/clients/types/ollama.md
  title: Ollama Client
  summary: 'Connecting to an Ollama server (default http://localhost:11434): selecting a model from the auto-fetched list,
    the ''API handles prompt template'' option (recommended off), the ''Allow thinking'' option for thinking-capable models,
    and troubleshooting offline/no-model states.'
- path: user-guide/clients/types/openai-compatible.md
  title: OpenAI Compatible Client
  summary: 'Using the generic OpenAI-compatible client for services without official Talemate support, with DeepInfra as the
    worked example: API URL/key, manual model name entry, the ''API handles prompt template'' option, and the Parameters tab
    toggles to omit temperature/top_p/presence_penalty for services that reject them.'
- path: user-guide/clients/types/openai.md
  title: OpenAI Client
  summary: 'Adding an OpenAI client and API key, the Model setting (defaults to gpt-4o), and required setup for o1/o3/gpt-5
    reasoning models: enable Reasoning and allocate 512-1024+ Reasoning Tokens, since empty responses usually mean the reasoning
    budget was exhausted.'
- path: user-guide/clients/types/openrouter.md
  title: OpenRouter Client
  summary: 'Adding an OpenRouter client: entering the API key, picking a model from the list dynamically fetched from your
    account (refresh by re-saving), and the Max token length (context) setting.'
- path: user-guide/clients/types/tabbyapi.md
  title: TabbyAPI Client
  summary: 'Connecting to a TabbyAPI instance: API URL (e.g. http://localhost:5000/v1), API key, context length, the ''API
    handles prompt template'' option (recommended off), and could-not-connect troubleshooting.'
- path: user-guide/clients/types/text-generation-webui.md
  title: Text-Generation-WebUI Client
  summary: 'Connecting to a Text-Generation-WebUI (ooba) instance: API URL (default port 5000), API key, the ''API handles
    prompt template'' option (routes requests to chat/completions so the backend applies the prompt template; response
    pre-filling keeps working via continue_), and context length, plus troubleshooting for bad generations (wrong prompt
    template), ''No model loaded'', and connection failures.'
- path: user-guide/debug-tools.md
  title: Debug Tools
  summary: The Debug Tools panel (bug icon in the toolbar) with its Prompts tab (inspect all AI prompts sent, force reasoning
    off per action), Memory tab (memory retrieval requests), and Vars tab. Explains game state variables, setting up watched
    paths in the Game State editor, and editing scene state.
- path: user-guide/howto/create-a-new-scene/create-empty-scene.md
  title: Create an empty scene
  summary: Tutorial step 1 of creating a basic scene, start a new empty scene from the Home screen Create button, fill in
    the scene outline (title, content classification, description, introduction) in the world editor, and save it with a project
    name.
- path: user-guide/howto/create-a-new-scene/create-npc.md
  title: Add an AI controlled character
  summary: Tutorial step 3 of creating a basic scene, create an AI-controlled character (NPC) via Create Character with AI
    generation instructions, refine the generated attributes/description, and save the scene.
- path: user-guide/howto/create-a-new-scene/create-player-character.md
  title: Add the player character
  summary: Tutorial step 2 of creating a basic scene, add a player character using the Create Character button with AI generation
    instructions and the Controlled by Player toggle, then save the scene.
- path: user-guide/howto/create-a-new-scene/test.md
  title: Test your scene
  summary: Tutorial step 4 of creating a basic scene, exit the World Editor, switch from Creative mode to Play mode via the
    gamepad button, and verify you control the player character and the AI character responds.
- path: user-guide/howto/infinity-quest-dynamic/1-create-the-scene-project.md
  title: 1 - Scene Project
  summary: Node editor crash course part 1, create the Infinity Quest Dynamic scene project, fill in title/description/content
    classification, import the Kaira and Elmer characters from the original Infinity Quest scene, and finalize the setup.
- path: user-guide/howto/infinity-quest-dynamic/2-initial-nodes.md
  title: 2 - Initial Nodes
  summary: Node editor crash course part 2, extend a custom Scene Loop from the default Talemate loop, create an event module
    hooked into scene initialization, test it, and make the dynamic introduction generation run only once on first load.
- path: user-guide/howto/infinity-quest-dynamic/3-improvements.md
  title: 3 - Improvements
  summary: Node editor crash course part 3, replace narrator generation with the dedicated Contextual Generate node for the
    scene introduction, add a reset mechanism to make testing easier, and generate a random thematic list to reduce AI bias
    in premises.
- path: user-guide/howto/infinity-quest-dynamic/4-get-organized.md
  title: 4 - Get organized
  summary: Node editor crash course part 4, organize the graph by selecting a node chain and extracting it into a separate
    submodule via the Create Module button, plus visual polish like styling/groups for agent actions.
- path: user-guide/howto/infinity-quest-dynamic/5-agentic-workflow.md
  title: 5 - Agentic Flow
  summary: Node editor crash course part 5, build a multi-agent, multi-stage workflow, stage 1 generates a random theme, stage
    2 has the Summarizer agent analyze it, stage 3 uses the analysis to inform the Creator agent's introduction generation.
    Covers stages, and reorganizing module inputs/outputs.
- path: user-guide/howto/infinity-quest-dynamic/6-reusable-module.md
  title: 6 - Reusable Module
  summary: Node editor crash course part 6, turn the scene-specific premise generator into a reusable module, rename/re-register
    modules, expose a reset toggle and content-control inputs, add an analysis on/off switch, propagate settings, and package
    it as a Talemate module usable in any scene.
- path: user-guide/howto/infinity-quest-dynamic/7-polish.md
  title: 7 - Polish
  summary: Node editor crash course part 7 (final), polish touches for shipping the Dynamic Story module, status indication,
    node comments, error handling, generating a story intention, and defaulting to the scene_loop_init event.
- path: user-guide/howto/infinity-quest-dynamic/index.md
  title: Building a Dynamic Story Generator with the Node Editor
  summary: Overview and table of contents for the 7-part node editor crash course that ports Infinity Quest to a dynamic story
    generator, teaching node workflows, AI agent usage (Creator, Summarizer), stages, and building reusable modules.
- path: user-guide/howto/use-dynamic-story-module/index.md
  title: Use the dynamic story module
  summary: Tutorial for installing and configuring the built-in Dynamic Storyline module (0.30+) from the world editor Mods
    tab to randomize the scene introduction of any scene, including keeping a locked foundation save file to restart new stories
    from.
- path: user-guide/inline-visuals.md
  title: Inline Visuals
  summary: The inline visuals feature (0.35.0+) that displays generated images directly in the scene feed. Covers generating
    via scene tools, director chat, autonomous direction and context investigation, quick actions and portrait management,
    and display settings, visual types (scene illustration/background/card, character card/portrait), render cadence, display
    size, and auto-attach.
- path: user-guide/integrations/runpod.md
  title: RunPod
  summary: 'Run text-generation-webui on rented RunPod GPUs: add the RunPod API key in APPLICATION settings (backend restart
    required), deploy a pod with the ''RunPod TheBloke LLMs'' template named to include ''thebloke llms'' or ''textgen'' so
    Talemate auto-discovers it, and load models via the pod''s web UI. Notes the instructions are somewhat outdated.'
- path: user-guide/interacting.md
  title: Interacting with the scene
  summary: How to play a scene, dialogue input conventions (quotes for speech, asterisks for actions), linebreaks, acting
    as another character or the narrator via tab (act-as), quick actions, player direction with
- path: user-guide/node-editor/core-concepts/collector_nodes.md
  title: Collector Nodes
  summary: 'Dict Collector and List Collector nodes that aggregate multiple inputs via dynamic sockets: key inference rules,
    the Make Key-Value Pair node, adding/removing input slots, nested collection, and the Advanced Format / Jinja2 Format
    nodes for turning collected data into formatted strings.'
- path: user-guide/node-editor/core-concepts/command_module.md
  title: Command Modules
  summary: 'Registering scene commands invoked with !name:arg0;arg1 syntax: creating a Command module, setting its name property,
    wiring Argument nodes to processing logic, and a full !instruct_actor example. Command modules load automatically with
    the scene.'
- path: user-guide/node-editor/core-concepts/error-handling.md
  title: Error Handling
  summary: Catching exceptions in node graphs with the Error Handler node (attach a handler function that receives an exc
    argument) and Unpack Exception (extract name/message for display or branching), with an example that logs errors to scene
    history.
- path: user-guide/node-editor/core-concepts/events.md
  title: Events
  summary: 'Creating Event modules that run when a specific event is emitted: accessing the event payload via the Event node,
    activating by adding to the scene loop with an event_name, or via auto_register on the module properties. Includes a worked
    example hooking the director''s generate-choices prompt to inject a dynamic instruction.'
- path: user-guide/node-editor/core-concepts/functions.md
  title: Functions
  summary: 'Building callable functions from node graphs: inline functions (Argument, Return, Define Function, Get Function,
    Call Function, Call For Each nodes), self-contained Function modules, and exposing functions to the LLM via FOCAL AI function
    calling (AI Function Callback, AI Function Calling, Process AI Function Call) with a complete Jinja2 prompt example.'
- path: user-guide/node-editor/core-concepts/modularity.md
  title: Modularity
  summary: The difference between Python nodes and code-less node modules, module core types (Module, Command, Event, Function,
    Scene Loop), the module load-order priority (scene > templates/modules/ > built-in) that lets you override built-ins,
    and promoting scene modules to shared modules with copy vs move.
- path: user-guide/node-editor/core-concepts/module-inheritance.md
  title: Module Inheritance
  summary: 'Extending an existing node module via ''Extend current'': inherited nodes are live references so base-module changes
    propagate to extensions; you can add but not modify base logic. Explains the extends property and when to copy instead
    of extend.'
- path: user-guide/node-editor/core-concepts/package.md
  title: Installable Packages
  summary: 'Packaging node modules so users can install them from the Mods list without the node editor: creating a Package
    module, its properties (name, author, description, restart-scene-loop flag), the Install Node Module and Promote Config
    nodes, and deploying to templates/modules/.'
- path: user-guide/node-editor/core-concepts/prompt-templates.md
  title: Prompt Templates
  summary: 'Using Jinja2 prompt templates in graphs: the Prompt from Template node (template_file vs template_text, variables,
    scope, dedupe), Template Variables and Generate Response nodes, template scope/file storage locations, prompting for JSON/YAML
    data structures with data_response, and two full worked examples.'
- path: user-guide/node-editor/core-concepts/prompt_building.md
  title: Prompt Building
  summary: 'The Build Prompt node as a high-level alternative to manual templates: automatic context assembly with include_*
    toggles (scene intent, memory/RAG, scene, character, gamestate context), dynamic instructions, token-budget management
    via reserved_tokens, and how it maps onto the common/base.jinja2 template.'
- path: user-guide/node-editor/core-concepts/staging.md
  title: Staging
  summary: 'Using core/Stage nodes to split long node chains into ordered execution steps: stage priority numbers (negative
    allowed), pass-through state sockets, how unstaged nodes run last, sharing data between stages with Set/Get State, and
    the X-key shortcut to drop a Stage node while dragging a connection.'
- path: user-guide/node-editor/core-concepts/states.md
  title: State Management
  summary: The state nodes (SetState, GetState, UnsetState, HasState, CounterState and conditional variants) and their scopes
    — local, parent, shared, scene loop, and game (saved with the scene) — plus agent-specific state nodes with scene and
    context scopes, and guidance on choosing scope lifetimes.
- path: user-guide/node-editor/core-concepts/switches.md
  title: Switches and conditional routing
  summary: 'Conditional routing nodes: Switch (truthy yes/no branching), RSwitch and RSwitchAdvanced (value selection), ORRouter/ANDRouter
    for combining flags, Case for multi-way exact-match branching, plus Invert and Coallesce helpers, with input/output payload
    tables and practical patterns.'
- path: user-guide/node-editor/core-concepts/user-interface.md
  title: Using the node editor
  summary: 'Node editor UI walkthrough: opening it from creative mode, the Module Library (listing groups, filtering, creating/deleting
    modules, registry paths with $N), the toolbar (debug menu, scene/module test runs, breakpoints), canvas operations (adding,
    connecting, selecting, copying, aligning nodes), quick W/S/X shortcuts for Watch/SetState/Stage nodes, groups, and comments.'
- path: user-guide/node-editor/index.md
  title: Introduction
  summary: Brief introduction to the node editor (added in 0.30.0), which enables code-less creation of complex scenes and
    reusable modules.
- path: user-guide/node-editor/reference/events.md
  title: Events
  summary: 'Reference list of all supported events with payload tables: game loop and scene loop lifecycle events, regenerate
    events, and per-agent events (conversation, creator, editor, narrator, director, world state, summarization, TTS, visual)
    including which payload fields are mutable for injecting instructions or rewriting responses.'
- path: user-guide/node-editor/reference/template_functions.md
  title: Template Functions
  summary: 'Reference for functions available inside prompt templates: response scaffolding (set_prepared_response, set_data_response,
    disable_dedupe), scene/memory/text queries (query_scene, query_memory, query_text, query_text_eval, instruct_text), agent
    access (agent_action, agent_config), utilities (time_diff, text_to_chunks, to_int, to_str, len, max, min, join, count_tokens,
    data_format_type, llm_can_be_coerced, config), and the condensed filter.'
- path: user-guide/node-editor/reference/useful-template-patterns.md
  title: Template Pattern Cheat Sheet
  summary: 'Copy-paste Jinja2 patterns for prompt templates: scene context with token budgets, memory retrieval via rag_build,
    character context with conditional detail, including reusable templates (scene-context, memory-context, character-context),
    budget-based conditionals, and response scaffolding with bot_token, set_prepared_response, and set_data_response.'
- path: user-guide/prompts/context-history-review.md
  title: Scene Context History Review
  summary: 'The Scene Context tab of the Prompt Manager visualizes how scene history is assembled into AI context, with color-coded
    sections (layered history, archived summaries, dialogue), per-section token counts, and tunable settings: best fit mode
    with min/max dialogue, manual dialogue/summary detail ratios, enforce boundary, and max token budget.'
- path: user-guide/prompts/deduplication.md
  title: Prompt Deduplication
  summary: Line-level fuzzy dedupe pass (removes >32-char lines with >=95% similarity) toggled per client on the Advanced
    tab; recommended off because it breaks prompt caching and can mangle structured content. Covers opting out per template
    with disable_dedupe() or the Prompt from Template node's dedupe property.
- path: user-guide/prompts/index.md
  title: Prompt Manager
  summary: 'Central UI for the Jinja2 prompt templates driving all AI interactions: template groups (default/user/scene/custom)
    with priority-based override resolution, the Active tab''s resolved template tree with outdated-override indicators, template
    editing, response extraction directives (AnchorExtractor, RegexExtractor, etc.), and the Prompts tab for inspecting sent
    prompts with a Test Changes re-send button. Includes 0.36.0 template restructuring upgrade notes.'
- path: user-guide/prompts/llm-prompt-templates.md
  title: LLM Prompt Templates
  summary: 'Manage base chat-format templates (ChatML, Llama3, Mistral, etc.) that wrap prompts for local LLM inference: built-in
    vs user templates in templates/llm-prompt/std/, creating and copying templates, pasting GGUF/llama.cpp chat templates
    with supported variables (messages, enable_thinking, thinking_budget), and assigning a template to a client.'
- path: user-guide/prompts/redefining-response-extraction.md
  title: Redefining Response Extraction
  summary: Advanced guide to customizing how content is extracted from LLM responses using template extractor functions (set_anchor_extractor,
    set_as_is_extractor, set_after_anchor_extractor), with a worked example separating <ANALYSIS> from <DIALOGUE> tags, plus
    fallback_to_full, tracked_tags for nested tags, and mod_response_length for extending the response token budget.
- path: user-guide/prompts/volatile-context-placement.md
  title: Volatile Context Placement
  summary: The Optimize for Prompt Caching client setting (Advanced tab) moves volatile content (RAG memory, dynamic notes)
    after scene history so provider prompt caches stay valid, cutting latency and cost on Anthropic/OpenAI/Google; includes
    per-agent Auto/On/Off overrides and guidance on when not to enable it (local or weaker models).
- path: user-guide/restoring-scenes.md
  title: Restoring Scenes from Backups
  summary: Two ways to return a scene to a previous state, restore from the automatic changelog version history (via the scene
    card's three-dot menu, with earliest/latest/date-filter options) and restore from a designated restore point save file.
    Both create a new unsaved scene.
- path: user-guide/saving.md
  title: Saving
  summary: How scene saving works, .json save files in the project directory, automatic changelog version history, restore
    points, saving from the scene or world editor, auto save (and why the toggle can be locked), Save As, and forking a copy
    of a scene.
- path: user-guide/scenario-tools.md
  title: Scene Tools
  summary: The scene tools toolbar and agent activity bar. Covers actor actions, director actions, narrator actions, advancing
    time, world state actions, creative tools (e.g. taking characters in/out of the scene, introducing new characters with
    optional example dialogue generation and guidance), the visualizer menu, and saving, with Ctrl/Cmd modifier click behavior.
- path: user-guide/scene-directory.md
  title: Scene Directory Structure
  summary: Layout of a scene's project directory under scenes/, save .json files, and the assets/, changelog/, nodes/, templates/,
    shared-context/, and info/ subdirectories, and why the structure matters for backups and restores.
- path: user-guide/scene-state-reset.md
  title: Reset Scene State
  summary: The Reset Scene State dialog for selectively clearing scene-internal state, context DB (memory/RAG reimport), history,
    intent state, agent states, and reinforcements, without touching character definitions or world entries. Useful for stale
    cached data or restarting progression.
- path: user-guide/templates/attribute.md
  title: Character Attribute
  summary: 'Create and use Character Attribute templates for AI-generating character traits in the World Editor: attribute
    name, generation priority, additional instructions with {character_name}/{player_name} variables, spice and writing-style
    support flags, favorites, and applying the template in the Character Editor''s Attributes section.'
- path: user-guide/templates/detail.md
  title: Character Detail
  summary: 'Create and use Character Detail templates for AI-generating longer-form character backstory answers: question/statement
    field (questions work best), additional instructions with {character_name}/{player_name} variables, spice and writing-style
    support flags, and applying the template in the Character Editor''s Details section.'
- path: user-guide/templates/groups.md
  title: Groups
  summary: All world-state templates live in groups; this page covers creating a group (name, author, description) via the
    Create Group button in the Templates sidebar and deleting a group.
- path: user-guide/templates/index.md
  title: Templates
  summary: 'Overview of the Templates tab and the six world-state template types: Character Attribute, Character Detail, Spices
    (randomization), Writing Style, State Reinforcement (tracked states), and Scene Type. Templates are organized into groups
    and shared across all games.'
- path: user-guide/templates/scene_type.md
  title: Scene Types
  summary: Create Scene Type templates whose instructions guide the director's style and pacing for a scene; currently an
    early WIP, usable only via import in the World Editor's Scene Direction section.
- path: user-guide/templates/spice.md
  title: Spice Collection
  summary: 'Create Spice Collection templates that inject a random {spice} instruction into attribute/detail generation: writing
    the additional-instructions pattern, adding or AI-generating spice values, and a worked example of applying a collection
    with the Generation Settings spice button and raising the application chance (ctrl-click) to 100%.'
- path: user-guide/templates/state.md
  title: State Reinforcement
  summary: 'Create State Reinforcement templates to track character or world states: question/attribute name, state type (all
    characters, player, NPCs, world), context attachment method, re-evaluation interval in turns, additional instructions,
    and auto-create for new characters; generated from the Character Editor''s States tab.'
- path: user-guide/templates/writing-style.md
  title: Writing Styles
  summary: Create Writing Style templates that apply tone/style instructions to generated content, and configure phrase detection
    (0.30.0+) for the Editor agent's revision actions using regex or semantic-similarity matching against unwanted phrases,
    including the requirement to set the writing style in Scene Settings.
- path: user-guide/time-passage.md
  title: Time Passage Management
  summary: Inserting time passage markers via the Advance Time scene tool (preset durations or custom) or between messages
    in the scene view, editing and deleting them in the scene view or World State Manager, and how time passages affect the
    AI's temporal context.
- path: user-guide/tracking-a-state.md
  title: Tracked states
  summary: Introduction to tracked states, periodic reinforcements of character or world facts kept in AI context. Explains
    what they are, how to reach the character editor and world editor state managers, inspecting state values, quickly applying
    states via templates, and the context attachment method.
- path: user-guide/visual-library.md
  title: Visual Library
  summary: The Visual Library dialog for generating and managing images, prompt/instruct modes, visual types, reference images,
    iterating and regenerating, the image queue, saving to scene assets, uploads, reference configuration, cover crop, and
    AI image analysis with tag generation.
- path: user-guide/voice-library.md
  title: Voice Library
  summary: The Voice Library for managing TTS voices across all providers, global vs scene scope tabs, API status, creating
    and managing voices, automatic and manual character voice assignment, and organizing voices with tags, filtering, and
    search.
- path: user-guide/world-editor/characters/actor.md
  title: Actor management
  summary: The Actor tab for AI characters, define dialogue instructions (acting/speaking directions like to a stage actor)
    and line-by-line dialogue examples to shape a character's speech style, with AI generate support for instructions.
- path: user-guide/world-editor/characters/attributes.md
  title: Attributes
  summary: Managing character attributes (short snapshot traits) in the character editor, adding via the New attribute input,
    editing, removing, and generating attributes in bulk using attribute templates.
- path: user-guide/world-editor/characters/create.md
  title: Character creation
  summary: Creating a new character with the Create Character button, the AI generation toggle and instructions field, name,
    description, generate-attributes option, the generate-example-dialogue option with its optional guidance field, and the
    Controlled by Player switch.
- path: user-guide/world-editor/characters/deactivate.md
  title: Activate and Deactivate Characters
  summary: Temporarily removing a character from dialogue generation with the Deactivate button and bringing them back with
    Activate, instant, without narration, versus doing it through scene tools which narrates the exit/entrance.
- path: user-guide/world-editor/characters/delete.md
  title: Delete character
  summary: Permanently deleting a character from a scene via the Delete button in the character editor, with a type-the-name
    confirmation step.
- path: user-guide/world-editor/characters/description.md
  title: Description
  summary: Editing a character's description (defining characteristics, personality, background, motivations) in the Description
    tab, changes apply automatically as you type, with AI generate/autocomplete support.
- path: user-guide/world-editor/characters/details.md
  title: Details
  summary: Managing character details (freeform background/history entries, names can be titles or questions), adding, editing,
    removing, setting up a tracked state from a detail, pinning a detail to context, and generating details from templates.
- path: user-guide/world-editor/characters/folders.md
  title: Folders
  summary: Organizing the character list sidebar into collapsible folders (0.37+), assigning via the folder input in the character
    editor, renaming, expanding/collapsing, member count chips, and how folder assignments sync across scenes.
- path: user-guide/world-editor/characters/import.md
  title: Import character
  summary: Importing a character from another existing Talemate scene using the Import character button in the Characters
    tab, pick source scene, pick character, import.
- path: user-guide/world-editor/characters/index.md
  title: Character Editor
  summary: Overview of the Characters tab in the World Editor and a character's components, attributes, details, description,
    tracked states, actor management (dialogue instructions/examples), and visuals, plus links to activation, player control,
    and folders.
- path: user-guide/world-editor/characters/player.md
  title: Make or Unmark a Player Character
  summary: Switching which character is player-controlled at any time, the Make Player Character button (auto-demotes the
    previous player to AI, auto-activates deactivated characters) and unmarking so all characters are AI-controlled.
- path: user-guide/world-editor/characters/states.md
  title: Tracked states
  summary: Setting up tracked state reinforcements for a character in the States tab, naming the state (questions work best),
    update frequency in turns, context attachment method, additional instructions, and refreshing or resetting a state.
- path: user-guide/world-editor/characters/visuals.md
  title: Character Visuals
  summary: The character Visuals tab with its four sub-tabs, cover images (CHARACTER_CARD reference images), portraits (types,
    management, automatic emotion-based selection, missing-tags warning), rules for permanent visual traits, and prompt finalization,
    plus generation prerequisites.
- path: user-guide/world-editor/context-db.md
  title: Context DB
  summary: Browsing and searching the scene's semantic memory database (Memory Agent) in the world editor, embedding-based
    search with the Search Strictness slider (0.1-2.0), manually adding entries, and a reset tool to rebuild the database.
- path: user-guide/world-editor/generation-settings.md
  title: Generation Settings
  summary: World editor AI content generation controls, ctrl+click Generate for an instructions dialog (seed material that
    must be reflected), alt+click to rewrite existing content, generation length with per-context-type memory, and applying
    writing style and spice templates.
- path: user-guide/world-editor/history/index.md
  title: History
  summary: The scene History manager, static archived entries (manually dated pre-scene backstory), summary entries auto-generated
    by the Summarizer agent, and layered history. Covers editing, deleting, regenerating, inspecting sources, compression
    statistics, Regenerate everything, and reset.
- path: user-guide/world-editor/history/layered-history.md
  title: Layered History
  summary: Explains layered history compression, base layer 0 (static plus summary entries) is re-summarized into increasingly
    compressed layers 1+, creating a detail gradient so old events stay in AI context. Covers compression statistics, configuration,
    management, and how layers appear in context.
- path: user-guide/world-editor/pins.md
  title: Pins
  summary: Pinning context entries so the AI always includes them in generation, creating pins from the Context editor or
    from character details, toggling pins active/inactive, and conditional automatic pinning via AI prompt conditions or game
    state conditions.
- path: user-guide/world-editor/scene/direction.md
  title: Direction
  summary: The scene Direction tab, set director instructions (story-specific guidance for director chat and auto-direction),
    the overall story intention, and the current scene phase/intention, both required for the director's Autonomous Scene
    Direction to be available.
- path: user-guide/world-editor/scene/export.md
  title: Export
  summary: Exporting a scene from the world editor, Talemate scene format (currently the only format), choosing the export
    file name, and the reset-progress option that clears messages, choices, and stateful data for a clean distributable copy.
- path: user-guide/world-editor/scene/game-state.md
  title: Game State
  summary: The Game State tab for viewing and editing persistent game state variables used by node modules, a raw JSON editor
    (invalid JSON is rejected) and a Watched Variables manager for adding/removing watch paths shown in Debug Tools.
- path: user-guide/world-editor/scene/outline.md
  title: Outline
  summary: The scene Outline tab, edit the scene's title, content classification (tone/expectation of generated content),
    perspective and tense, description, and the introduction text shown when a user first enters the scene.
- path: user-guide/world-editor/scene/settings.md
  title: Settings
  summary: Scene-level settings, selecting a writing style template, locking the save file to prevent overwriting, the experimental
    tag, restoration settings (designate a save as restore point and reset via Restore Scene), and the agent settings file.
- path: user-guide/world-editor/scene/shared-context.md
  title: Shared World & Episodes
  summary: The Shared World panel, create shared context .json files to share characters, world entries, and history across
    scenes in a project, link scenes, bulk-share elements, and manage episodes (alternative storylines) including creating
    new scenes from an episode.
- path: user-guide/world-editor/suggestions.md
  title: Suggestions
  summary: The Suggestions view where agent-proposed world changes (currently character changes only) accumulate for review,
    plus manually requesting proposals via the Suggest Changes button in the character editor.
- path: user-guide/world-editor/world/states.md
  title: Tracked states
  summary: Setting up world-level tracked state reinforcements via the New State Reinforcement button in the World editor,
    question or state description, optional pre-specified value, update frequency in turns, context attachment method, additional
    instructions, and resetting the reinforcement.
- path: user-guide/world-state.md
  title: World State
  summary: The world state snapshot panel, characters, objects, and tracked states summarized by the World State agent, clickable
    entity highlights in recent scene messages, manual and automatic snapshot refreshing, how the snapshot carries forward,
    wiping it, and pinning the snapshot to the scene.
