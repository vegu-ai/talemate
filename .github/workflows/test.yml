name: Python Tests

on:
  push:
    branches: [ main, 'prep-*' ]
  pull_request:
    branches: [ main, 'prep-*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        uv sync --extra dev --locked

    - name: Run linting
      run: |
        uv run pre-commit run --all-files

    - name: Download NLTK data
      run: |
        uv run python -c "import nltk; nltk.download('punkt_tab')"

    - name: Cache citation regression embedding model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
        key: ${{ runner.os }}-citation-minilm-1110a243fdf4706b3f48f1d95db1a4f5529b4d41

    - name: Provision citation regression embedding model
      run: |
        .venv/bin/python - <<'PY'
        from huggingface_hub import snapshot_download
        snapshot_download(
            repo_id="sentence-transformers/all-MiniLM-L6-v2",
            revision="1110a243fdf4706b3f48f1d95db1a4f5529b4d41",
            allow_patterns=["*.json", "*.txt", "*.safetensors"],
        )
        PY

    - name: Run tests
      run: |
        uv run pytest tests/ -p no:warnings
