- path: user-guide/agents/world-state/index.md
  title: Overview
  summary: Introduces the World State agent's current-world snapshot, tracked-state reinforcement, and character progression
    checks. Notes the text-generation client requirement and the ability to propose character description or attribute changes
    as the story evolves.
- path: user-guide/agents/world-state/settings.md
  title: Settings
  summary: Reference for snapshot refresh cadence, current-moment highlighting, durable accumulation and eviction, prompt
    pinning, tracked-state/context-pin updates, and character progression. Also covers automatic portrait selection and generation
    prerequisites plus snapshot memory retrieval.
- path: user-guide/api-key-encryption.md
  title: API Key Encryption
  summary: Since 0.36.0 all api_key and override_api_key fields are Fernet-encrypted in config.yaml with an 'ENC:' prefix.
    Covers OS keyring storage, the secrets/encryption.key fallback, TALEMATE_DISABLE_KEYRING, TALEMATE_ENCRYPTION_KEY_DIR,
    Docker volumes, and losing the key.
- path: user-guide/apis/anthropic.md
  title: Anthropic API Setup
  summary: Create an Anthropic API key at console.anthropic.com/settings/keys, then add it under Settings -> Connections ->
    API Keys -> Anthropic and save.
- path: user-guide/apis/cohere.md
  title: Cohere API Setup
  summary: Create a Cohere API key at dashboard.cohere.com/api-keys, then add it under Settings -> Connections -> API Keys
    -> Cohere and save.
- path: user-guide/apis/elevenlabs.md
  title: ElevenLabs
  summary: Create an ElevenLabs account and copy the API key from your profile, then add it under Settings -> Connections
    -> API Keys -> ElevenLabs and save before configuring the voice agent.
- path: user-guide/apis/google.md
  title: Google Cloud Setup
  summary: 'Setting up Google Gemini via Vertex AI: create a Google Cloud project, enable the Vertex AI API, create a service
    account and download its JSON credentials, then set the Credentials Path and Location under Settings -> Connections ->
    API Keys -> Google.'
- path: user-guide/apis/groq.md
  title: Groq API Setup
  summary: Create a Groq API key at console.groq.com/keys, then add it under Settings -> Connections -> API Keys -> groq and
    save.
- path: user-guide/apis/mistral.md
  title: Mistral.ai API Setup
  summary: Create a Mistral.ai API key at console.mistral.ai/api-keys, then add it under Settings -> Connections -> API Keys
    -> mistral.ai and save.
- path: user-guide/apis/openai.md
  title: OpenAI API Setup
  summary: Create an OpenAI API key at platform.openai.com/api-keys, then add it under Settings -> Connections -> API Keys
    -> OpenAI and save. OpenAI is usable for text, image and audio generation.
- path: user-guide/apis/openrouter.md
  title: OpenRouter API Setup
  summary: Create an OpenRouter API key at openrouter.ai/keys, then paste it into the API Key field under Settings -> Connections
    -> API Keys -> OpenRouter and save to reach any model OpenRouter exposes.
- path: user-guide/app-settings/appearance.md
  title: Appearance
  summary: Appearance settings, split into Theme, Messages and Visuals. Theme lists every theme template under its group with
    color swatches - Apply repaints the app and copies the theme's message styling into the appearance settings after a confirmation
    (colors the user set are kept and keep overriding), Manage opens the theme's template. Messages covers per-type italic/bold/show/color
    and markup styling, with Reset and Restore from theme (re-copies the theme's styling and drops all color overrides). Visuals
    covers render cadence, display size and Auto Backdrop.
- path: user-guide/app-settings/application.md
  title: Connections
  summary: The Connections settings group - Clients, Agents and the API Keys page holding all third-party credentials, including
    the HuggingFace token for gated weights like Pocket TTS, plus the Environment Variables page (0.39.0) passed to spawned
    processes.
- path: user-guide/app-settings/creator.md
  title: Storytelling
  summary: The Storytelling settings group with two global picker lists - Content Classification strings offered when setting
    up a scene, and Perspective Presets (0.38.0) offered in every scene-outline 'Perspective and tense' combobox - plus the
    {player_name} placeholder.
- path: user-guide/app-settings/game.md
  title: Game
  summary: 'The Game settings group: Auto save, Auto progress, Max backscroll, Show agent activity bar, Release GPU cache
    on scene load, the default Player Character, and the Sound page (persisted playback volume and mute, also controlled from
    the status bar). Also how the Settings tab works - sidebar groups, search, and the unsaved changes indicator with Save/Discard.'
- path: user-guide/app-settings/presets.md
  title: Presets
  summary: The Presets settings group with three pages - Inference (per-action generation parameter presets such as Analytical
    and Conversation), Embeddings (embedding models for the memory agent's chromadb), and System Prompts (app-wide overrides
    per prompt kind).
- path: user-guide/app-settings/system-prompts.md
  title: System Prompt Overrides
  summary: Overriding system prompts per prompt kind (Conversation, Narration, Creation, Direction, Analysis, Editing, World
    State, Summarization). Explains the client override > app-level override > built-in default order, the Normal vs Uncensored
    tabs, the Apply Default button and {{ system_prompt }} inlining.
- path: user-guide/character-card-import.md
  title: Character Card Import
  summary: How to import TavernAI-style character cards (Chara Card V0-V3, PNG/JPG/WebP images or JSON) from the home screen's
    Import dropzone or the Scene Library's Character Cards section to create a new scene. Covers the import dialog, character
    detection/manual selection, the AI Generation section (per-step generation toggles with card-data fallback, Full/Minimal
    presets, and the director's attribute limit capping extracted attributes), options for character book entries, alternate
    greetings, shared context setup, writing style template, player character setup, and troubleshooting failed analysis.
- path: user-guide/clients/auto-retry.md
  title: Auto Retry
  summary: Configures per-client automatic retries for empty responses, HTTP 429 rate limits, and missing reasoning patterns
    before Talemate displays its normal error dialog. Explains retry timing, attempt notifications, aborting, and the distinction
    from client-side request rate limiting.
- path: user-guide/clients/client-configuration.md
  title: Client Configuration
  summary: Walks through the Connections → Clients settings page, including adding, selecting, renaming, assigning, disabling,
    and removing clients. Details editor sections, shared API keys, validation, and the Save/Discard working-copy workflow
    introduced in 0.40.0.
- path: user-guide/clients/concurrent-requests.md
  title: Concurrent Requests
  summary: Explains which hosted and local clients can process parallel LLM requests and which batch operations benefit, including
    visual prompts, tool calls, world-state work, and progression checks. Covers defaults, llama.cpp/Pi Bridge requirements,
    rate-limit interactions, and when to disable concurrency.
- path: user-guide/clients/endpoint-override.md
  title: Endpoint Override
  summary: Shows how supported remote clients can target a trusted proxy or gateway such as LiteLLM instead of the provider's
    default API endpoint. Defines the separate base URL and proxy API-key fields and warns against sending official provider
    credentials to untrusted endpoints.
- path: user-guide/clients/hibernate.md
  title: Hibernation
  summary: Describes hiding an unused configured client without deleting and later recreating it. Shows how the client-row
    power control hibernates the client to reduce UI clutter and how the same control restores it.
- path: user-guide/clients/index.md
  title: Overview
  summary: Introduces Talemate clients as connections to local and hosted text-generation APIs and explains why different
    agents can use different models. Links the model testing harness and catalogs officially supported remote/local APIs plus
    services usable through the OpenAI-compatible client.
- path: user-guide/clients/model-testing-harness.md
  title: Model Testing Harness
  summary: Explains how to load and run the bundled six-test scene for qualifying configured LLM clients. Maps each test to
    its agent and requirement—literal instructions, structured data, conversation, narration, FOCAL calls, and multi-step
    problem solving—and interprets failures.
- path: user-guide/clients/presets.md
  title: Inference Configuration
  summary: Documents inference preset categories, sampler parameters, extra stop strings, advanced XTC/DRY/smoothing/adaptive
    controls, and backend support differences. Covers editing, applying or resetting presets, creating groups, assigning a
    group to a client, and saving changes.
- path: user-guide/clients/prompt-templates.md
  title: Prompt Templates
  summary: Explains why local clients that render their own prompts need the correct model-specific template and how Talemate
    attempts Hugging Face metadata detection. Covers manual selection, template locking, the template manager, and durable
    user templates stored under templates/llm-prompt/std/user.
- path: user-guide/clients/rate-limiting.md
  title: Rate Limiting
  summary: Describes Talemate's per-client requests-per-minute cap and the notification shown when the limit is reached. Explains
    waiting for reset versus aborting the generation and distinguishes this local throttle from automatic retries for provider
    HTTP 429 responses.
- path: user-guide/clients/reasoning.md
  title: Reasoning Model Support
  summary: Covers enabling reasoning, allocating reasoning tokens, stripping and validating thinking patterns, prefills, missing-pattern
    behavior, and model compatibility. Also explains per-agent-action overrides that disable reasoning selectively and how
    to manage or troubleshoot them.
- path: user-guide/clients/recommended-models.md
  title: Recommended Local Models
  summary: States that Talemate no longer maintains a fixed recommended-model list, points to an external benchmark, and advises
    against models below 7B. Recommends the bundled Model Testing Harness for checking a candidate model's formats and function-calling
    ability.
- path: user-guide/clients/response-length.md
  title: Response Length Enforcement
  summary: Explains how Talemate combines API token caps with prompt-level human-readable length instructions. Defines the
    token-to-instruction mapping, all four enforcement modes, the uncapped warning, defaults, and where to save the per-client
    setting.
- path: user-guide/clients/section-format.md
  title: Section Format
  summary: Documents the per-client choice between Markdown headings and paired uppercase XML tags for named prompt sections.
    Clarifies what formatting changes and what remains untouched, then shows where to set and save the option in Advanced
    client settings.
- path: user-guide/clients/template-locking.md
  title: Template Locking
  summary: Explains how locking prevents a client's prompt template from changing when its model changes, including the reasoning/non-reasoning
    variant use case. Walks through selecting, saving, verifying, and later removing a lock to restore automatic Hugging Face-based
    detection.
- path: user-guide/clients/types/anthropic.md
  title: Anthropic Client
  summary: Setup guide for adding an Anthropic client, configuring the shared API key, choosing or manually entering a model,
    and setting context length. Notes the default Claude model and that concurrent inference is enabled by default for supported
    batch operations.
- path: user-guide/clients/types/cohere.md
  title: Cohere Client
  summary: Setup guide for adding a Cohere client, supplying the shared Cohere API key, saving it to a ready state, and configuring
    its name, model, and context length. Notes that exact model identifiers can be entered before Talemate's built-in list
    is updated.
- path: user-guide/clients/types/deepseek.md
  title: DeepSeek Client
  summary: Setup guide for DeepSeek authentication, model selection, and context length, with available chat and reasoner
    model choices. Gives the reasoning-specific requirement to enable reasoning and reserve enough tokens so internal thinking
    does not consume the visible-response budget.
- path: user-guide/clients/types/google.md
  title: Google Client
  summary: Setup guide for the Google client using shared Google Cloud credentials, model and context settings, and the provider
    safety-setting override. Notes that concurrent inference is enabled by default and that unlisted new model identifiers
    may be entered manually.
- path: user-guide/clients/types/groq.md
  title: Groq Client
  summary: Setup guide for adding and authenticating a Groq client, selecting a model, setting context length, and confirming
    ready status. Notes the current default model and the ability to enter exact identifiers that Talemate has not yet added
    to its model list.
- path: user-guide/clients/types/koboldcpp.md
  title: KoboldCpp Client
  summary: Configures a local KoboldCpp client for United or OpenAI-compatible API mode, authentication, context, prompt templates,
    and supported generation parameters. Also details automatic Visualizer/TTS integration, TTS capability detection and lifecycle,
    opting out, and connection troubleshooting.
- path: user-guide/clients/types/llamacpp.md
  title: llama.cpp Client
  summary: Configures Talemate against a local llama-server, including URL, optional authentication, context size, prompt-template
    ownership, reasoning behavior, and optional concurrency. Provides startup and connectivity troubleshooting and explains
    the parallel-slot requirement for real concurrent inference.
- path: user-guide/clients/types/lmstudio.md
  title: LMStudio Client
  summary: Setup guide for connecting Talemate to an LMStudio local server with URL, optional API key, context length, and
    prompt-template selection. Emphasizes that launching LMStudio alone is insufficient—the embedded server must also be started—and
    lists common connectivity causes.
- path: user-guide/clients/types/mistral.md
  title: Mistral.ai Client
  summary: Setup guide for adding a MistralAI client, configuring its shared API key, model identifier, and context length.
    Notes that concurrent inference is on by default for supported batch work but actual parallelism remains subject to the
    account's rate limits.
- path: user-guide/clients/types/ollama.md
  title: Ollama Client
  summary: Configures Talemate for a local Ollama server, including reachability, installed model selection, context, server-side
    prompt templates, and thinking support. Explains refreshing the model list through Save and diagnoses offline, unloaded-model,
    and wrong-template behavior.
- path: user-guide/clients/types/openai-compatible.md
  title: OpenAI Compatible Client
  summary: Shows how to connect unsupported services such as DeepInfra through an OpenAI-like endpoint, with URL, key, model,
    context, and prompt-template ownership. Documents per-parameter send toggles for services that reject unsupported sampler
    fields and recommends official clients when available.
- path: user-guide/clients/types/openai.md
  title: OpenAI Client
  summary: Setup guide for OpenAI authentication, model and context selection, and default-on concurrent inference. Gives
    special guidance for o1, o3, and GPT-5 reasoning families, including enabling reasoning and allocating enough tokens to
    avoid empty visible responses.
- path: user-guide/clients/types/openrouter.md
  title: OpenRouter Client
  summary: Covers OpenRouter key setup, dynamically fetched model choices, context length, default-on concurrency, and refreshing
    the catalog. Documents toggles that omit individual sampler parameters when a selected downstream provider rejects them.
- path: user-guide/clients/types/pi-bridge.md
  title: Pi Bridge Client
  summary: Explains how Talemate launches isolated pi coding-agent RPC processes as an LLM bridge while disabling coding tools
    and project context. Covers installation, pi-owned credentials and custom providers, encrypted environment variables,
    model/thinking/concurrency settings, Docker persistence, and stream tracing.
- path: user-guide/clients/types/tabbyapi.md
  title: TabbyAPI Client
  summary: Setup guide for a local TabbyAPI server, including URL, optional authentication, context length, and choosing whether
    the server owns prompt rendering. Recommends Talemate-side templates by default and lists server, URL, key, firewall,
    and template causes for failures.
- path: user-guide/clients/types/text-generation-webui.md
  title: Text-Generation-WebUI Client
  summary: Configures Talemate for a local Text-Generation-WebUI server with URL, optional key, context, and optional chat/completions
    prompt handling. Explains coercion and reasoning behavior in server-template mode and troubleshoots unloaded models, connection
    failures, and wrong templates.
- path: user-guide/debug-tools.md
  title: Debug Tools
  summary: 'The bug-icon Debug Tools panel with its Prompts, Memory and Vars tabs: inspecting sent prompts (and forcing reasoning
    off per action), watching memory retrieval, and editing game state variables. Covers the Pinned Variables manager''s independent
    Debug Vars and Scene toolbar targets, shared per-path control settings (label, description shown as a tooltip on the
    control, order, read-only, number bounds and slider, string choices) and the limits they place on every edit, Debug Vars
    path subtitles, type-matched toolbar knobs, slash-separated paths, the three ways to open the Game State Editor including
    the tune button at the left end of the knob toolbar, and the full state JSON editor.'
- path: user-guide/howto/create-a-new-scene/create-empty-scene.md
  title: Create an empty scene
  summary: Walkthrough for starting a blank scene from the Home screen's Create new scene card and the New scene setup dialog
    (name, writing style, director persona), then filling in the scene outline - title, content classification, description,
    introduction - and saving it.
- path: user-guide/howto/create-a-new-scene/create-npc.md
  title: Add an AI controlled character
  summary: 'Second half of the new-scene walkthrough: create an AI (non-player) character via Create Character with Enable
    AI Generation and AI Generation Instructions, leaving Controlled by Player off. Review the generated attributes, then
    use the Actor tab''s Generate button for dialogue instructions.'
- path: user-guide/howto/create-a-new-scene/create-player-character.md
  title: Add the player character
  summary: 'Walkthrough step for adding the player character in the World Editor Characters tab: Create Character, Enable
    AI Generation with instructions, the Name and Description fields, and the Controlled by Player switch. Uses the example
    character Annabelle.'
- path: user-guide/howto/create-a-new-scene/test.md
  title: Test your scene
  summary: 'Closing step of the create-a-scene walkthrough: leave the World Editor and switch from Creative mode to Play mode
    with the gamepad button near the message input, taking control of the player character.'
- path: user-guide/howto/infinity-quest-dynamic/1-create-the-scene-project.md
  title: 1 - Scene Project
  summary: 'Part 1 of the node editor crash course: create the Infinity Quest Dynamic scene project, fill in Title, Content
    Classification and Description, import and activate the Elmer and Kaira characters from infinity-quest.json, then set
    the Locked save file and restoration file in Scene > Settings.'
- path: user-guide/howto/infinity-quest-dynamic/2-initial-nodes.md
  title: 2 - Initial Nodes
  summary: 'Part 2 of the node editor crash course: extend the default Scene Loop, add an Event module (On Scene Init) bound
    to scene_loop_init, and wire Generate Progress Narration, Make Text and Set Introduction. Gated to run once with Get State,
    Set State and a Switch.'
- path: user-guide/howto/infinity-quest-dynamic/3-improvements.md
  title: 3 - Improvements
  summary: 'Part 3 of the node editor crash course: swap Generate Progress Narration for a Contextual Generate node (context_type
    scene intro), add Stage 0/Stage 1 with a RESET Make Bool and Unset State for regenerating the intro, plus random theme
    selection via Generate Thematic List.'
- path: user-guide/howto/infinity-quest-dynamic/4-get-organized.md
  title: 4 - Get organized
  summary: 'Part 4 of the node editor crash course: extract the theme and premise node chain into a new Generate Premise submodule
    from a selection, clean up the auto-created socket nodes, and replace the original chain in On Scene Init. Adds an OUT
    theme socket and a Module Style node.'
- path: user-guide/howto/infinity-quest-dynamic/5-agentic-workflow.md
  title: 5 - Agentic Flow
  summary: 'Part 5 of the node editor crash course: split Generate Premise into staged groups - Stage 1 Generate Theme, Stage
    2 Analyze Theme (Get Agent Summarizer, Prompt from Template, Generate Response), Stage 3 Generate Introduction - passing
    data between them via local state.'
- path: user-guide/howto/infinity-quest-dynamic/6-reusable-module.md
  title: 6 - Reusable Module
  summary: 'Part 6 of the node editor crash course: turn the scene-specific generator into a reusable Dynamic Premise module,
    expose reset, topic, analysis_instructions and analysis_enabled through Module Property and Input Socket nodes, rewrite
    the prompt templates with jinja2, then install it into templates/modules.'
- path: user-guide/howto/infinity-quest-dynamic/7-polish.md
  title: 7 - Polish
  summary: 'Part 7 of the node editor crash course: add an Emit Status busy indicator at Stage 0, canvas comments, and an
    error-handling group (Argument, Unpack Exception, Case, Coallesce, Return, Error Handler). Also sets scene_loop_init as
    the default event.'
- path: user-guide/howto/infinity-quest-dynamic/index.md
  title: Building a Dynamic Story Generator with the Node Editor
  summary: 'Overview and table of contents for the seven-part node editor tutorial that ports Infinity Quest to a dynamic
    story generator, shipped as the Dynamic Storyline node in 0.30. Parts: Scene Project, Initial Nodes, Improvements, Get
    Organized, Agentic Workflow, Reusable Module, Polish.'
- path: user-guide/howto/use-dynamic-story-module/index.md
  title: Use the dynamic story module
  summary: 'Tutorial for applying the shipped Dynamic Storyline module to any scene: save a progress-free foundation scene
    with Locked save file, install the module from the World Editor''s Mods tab, Configure it with a topic and analysis instructions,
    then Reload Scene to trigger generation.'
- path: user-guide/inline-visuals.md
  title: Inline Visuals
  summary: Images generated by the visualizer displayed inside the scene feed (0.35.0). Covers the scene tools visualizer
    menu (Visualize Scene Card/Background, per-character Card/Portrait, Visualize Moment), Director chat and autonomous direction,
    the image context menu, the scene backdrop and Immersive toggle.
- path: user-guide/integrations/runpod.md
  title: RunPod
  summary: Outdated guide (the RunPod settings category no longer exists) to running text-generation-webui on RunPod GPUs
    - the API key, community vs secure cloud, the 'RunPod TheBloke LLMs' template, the pod-name requirement for auto-discovery,
    and port 7860.
- path: user-guide/interacting.md
  title: Interacting with the scene
  summary: 'Playing a scene from the input box: quotes for speech and asterisks for actions, shift+enter linebreaks, tab to
    act as another character, ''@'' quick actions, ''#'' player direction for the autonomous director (0.37.0), ctrl+enter
    autocomplete, and message revision history.'
- path: user-guide/node-editor/core-concepts/collector_nodes.md
  title: Collector Nodes
  summary: 'Dict Collector and List Collector nodes with dynamic item{i} sockets: key inference from the source node''s name,
    Make Key-Value Pair tuples, adding input slots, nested collection, and Format vs Advanced Format vs Jinja2 Format.'
- path: user-guide/node-editor/core-concepts/command_module.md
  title: Command Modules
  summary: 'Command node modules let players type "!name:arg_0;arg_1" in the scene: the module''s name/icon/menu properties,
    Argument nodes, and an !instruct_actor example. A menu id exposes the command in the scene tools custom commands menu,
    with a dialog that prompts for declared arguments. Command modules load automatically with the scene, no scene-loop placement
    needed.'
- path: user-guide/node-editor/core-concepts/error-handling.md
  title: Error Handling
  summary: Catching uncaught graph exceptions with the Error Handler node (core/ErrorHandler) and a handler function taking
    an `exc` argument, plus Unpack Exception (core/functions/UnpackException) to split it into name and message.
- path: user-guide/node-editor/core-concepts/events.md
  title: Events
  summary: 'Event node modules run when a named event fires: the Event node exposes the emission object, and activation is
    either placing the module in the scene loop with an `event_name` or setting `event_name` plus `auto_register`. Example
    hooks agent.director.generate_choices.inject_instructions.'
- path: user-guide/node-editor/core-concepts/functions.md
  title: Functions
  summary: Inline functions (Argument, Return, Define Function, Get Function, Call Function, Call For Each) versus reusable
    Function modules, and FOCAL AI function calling via AI Function Callback / AI Function Calling / Process AI Function Call,
    with a focal.callbacks.<name>.render() jinja2 template example.
- path: user-guide/node-editor/core-concepts/modularity.md
  title: Modularity
  summary: Nodes versus node modules, the module base types (Module, Command, Event, Function, Scene Loop), and load priority
    - scene modules override templates/modules/ which override built-ins. Also promoting a scene module to a shared module,
    Copy vs Move.
- path: user-guide/node-editor/core-concepts/module-inheritance.md
  title: Module Inheritance
  summary: 'Extending a node module via the `extends` property ("Extend current" in the Create Module menu): inherited nodes
    stay live references so base-module changes propagate, and the extension can only add. Contrasts Copy (independent duplicate)
    with Extend.'
- path: user-guide/node-editor/core-concepts/package.md
  title: Installable Packages
  summary: 'Making node modules installable so they appear in a scene''s Mods list: the Package module and its properties
    (name, author, description, installable, restart scene loop), the Install Node Module and Promote Config nodes, and templates/modules/.'
- path: user-guide/node-editor/core-concepts/prompt-templates.md
  title: Prompt Templates
  summary: 'Jinja2 prompt templates in graphs: the Prompt from Template node (template_file vs template_text, variables, scope,
    dedupe), Template Variables and Generate Response, where scoped .jinja2 files are stored, and data_response for JSON/YAML
    structures.'
- path: user-guide/node-editor/core-concepts/prompt_building.md
  title: Prompt Building
  summary: 'The Build Prompt node as the quick alternative to hand-built templates: the include_scene_intent / extra_context
    / memory_context / scene_context / character_context / gamestate_context toggles, reserved_tokens budgeting, memory_prompt
    RAG query, dedupe_enabled, prefill_prompt and Dynamic Instruction inputs.'
- path: user-guide/node-editor/core-concepts/staging.md
  title: Staging
  summary: 'The core/Stage node orders execution inside a module: the integer `stage` property (lowest first, unstaged nodes
    run last), the state/state_b/state_c/state_d passthrough sockets, the X drag shortcut, and local-scope Set State / Get
    State.'
- path: user-guide/node-editor/core-concepts/states.md
  title: State Management
  summary: State nodes (SetState, GetState, UnsetState, HasState, CounterState and the Conditional variants) and their scopes
    - local, parent, shared, scene loop, game (saved with the scene) - plus agent state nodes with `scene` and `context` scopes.
- path: user-guide/node-editor/core-concepts/switches.md
  title: Switches and conditional routing
  summary: 'Conditional routing nodes: core/Switch (truthiness, pass_through), core/RSwitch and RSwitchAdvanced, ORRouter
    and ANDRouter with grouped a-d flags, core/Case multi-way matching (attribute_name, case_a-d), Invert and Coallesce. Only
    None, False and UNRESOLVED are falsy.'
- path: user-guide/node-editor/core-concepts/user-interface.md
  title: Using the node editor
  summary: 'Node editor UI walkthrough: opening it in creative mode, the Module Library (scene / agents / core / installed
    groups, locked modules, Create Module types, registry paths), the toolbar debug menu with scene-test, module-test and
    breakpoints, and canvas work - node search, groups, comments, and the W / S / X drag shortcuts.'
- path: user-guide/node-editor/index.md
  title: Introduction
  summary: One-paragraph entry point for the node editor (introduced in 0.30.0), linking the node reference, event reference
    and template functions pages.
- path: user-guide/node-editor/reference/events.md
  title: Events
  summary: 'Every event a node graph can listen for, with payload fields: game loop (game_loop, game_loop_actor_iter, game_loop_new_message,
    player_turn_start), scene loop (scene_init, scene_loop_init/_after, start/end cycle, error), regenerate.msg.*, per-agent
    hooks including inject_instructions and .generated, and scene asset events.'
- path: user-guide/node-editor/reference/nodes/agents-conversation.md
  title: Conversation Agent Nodes
  summary: Two nodes - Generate Conversation (agents/conversation/Generate) which produces a character's dialogue via the
    conversation agent without pushing it to history, and Conversation Settings which exposes every conversation agent setting
    as an output socket.
- path: user-guide/node-editor/reference/nodes/agents-creator.md
  title: Creator Agent Nodes
  summary: 'Nine creator-agent nodes: Contextual Generate (context_type), Generate Character (Fast mode consolidation and
    fill-in-misses), the Create Character module, Determine Character Name / Description / Dialogue Instructions, Determine
    Content Context, Generate Thematic List and Creator Settings.'
- path: user-guide/node-editor/reference/nodes/agents-director-auto.md
  title: Director Auto-Direction Nodes
  summary: 'Six auto-direction nodes: the Auto Direction and Generate Auto Direction modules, Determine Scene Intent, Generate
    Scene Types (instructions, max_scene_types), plus the deprecated Auto Direct Candidates and Is Due For Instruction.'
- path: user-guide/node-editor/reference/nodes/agents-director-chat-actions.md
  title: Director Chat Actions
  summary: 'The ten actions the director chat AI can invoke, each a DirectorChatAction module with instructions, example_json
    and allow_concurrent properties: create_image, direct_scene, direct_story_arc, gameplay, ooc, query, update_context, update_gamestate,
    yield_to_user, plus Director Action Summary.'
- path: user-guide/node-editor/reference/nodes/agents-director-chat-instructors.md
  title: Director Chat Instructors
  summary: 'Ten instructor modules the director chat uses to apply changes: Instruct Character, Instruct Narrator (narration_type),
    Instruct Character Creation / Updates / Changes / Config Updates, Instruct World Updates, Instruct History Updates, Instruct
    Gamestate Updates and Instruct Story Config Updates.'
- path: user-guide/node-editor/reference/nodes/agents-director-chat.md
  title: Director Chat Nodes
  summary: 'Director chat plumbing: Director Action Argument, Director Action Confirm (accepted/rejected, raise_on_reject),
    Director Chat Sub Action gating (availability, force_enabled), Get Director Chat Context, and the context/query modules
    - character context, query world information / game state / scene direction, toggle character.'
- path: user-guide/node-editor/reference/nodes/agents-director-plan.md
  title: Director Planning Nodes
  summary: 'Director plan nodes: Create Plan, Create Outline, Critique Outline, Insert / Edit / Remove / Complete Task, Delete
    Plan, Get Active Plan and Get Active Chat Plan ID, Expand Story Arc (chunk_size, close_arc), Estimate Words and the manage_plan
    chat action module.'
- path: user-guide/node-editor/reference/nodes/agents-director.md
  title: Director Agent Nodes
  summary: 'Fifteen director nodes: Scene Direction (max_actions, always_on, run_immediately), Persist Character, Assign Voice,
    Log Director Action, Insert Chat Message, Roll Dice, Instruct Avatar Generation, the direct_actor / direct_narrator /
    yield_to_user function modules and Director Settings.'
- path: user-guide/node-editor/reference/nodes/agents-editor.md
  title: Editor Agent Nodes
  summary: 'Four editor-agent nodes: Clean Up Character Message (exposition formatting, quote balancing), Clean Up Narration,
    Clean Up User Input (never edits input starting with the ! @ / command prefixes), each with a `force` property, and Editor
    Settings.'
- path: user-guide/node-editor/reference/nodes/agents-memory.md
  title: Memory Agent Nodes
  summary: Query Context DB (agents/memory/QueryContextDB) for RAG lookups with queries, meta_filters, max_tokens, limit and
    iterate plus fn_filter / fn_formatter functions, and Unpack Memory Document which exposes meta, id, raw, as_text, as_dict,
    context_id.
- path: user-guide/node-editor/reference/nodes/agents-narrator.md
  title: Narrator Agent Nodes
  summary: 'Twelve narrator nodes generating NarratorMessages without pushing them to history: Generate Progress, Scene, Environment,
    Query, Character, Character Entry / Exit, After Dialog and Time Narration, all with narrative_direction and response_length,
    plus the autoNarration event module and Narrator Settings.'
- path: user-guide/node-editor/reference/nodes/agents-summarizer.md
  title: Summarizer Agent Nodes
  summary: 'Five summarizer nodes: Summarize Scene Progression (summary and analysis outputs), Generate Tags, the onMessageSetAvatar
    event module listening on agent.conversation.generated, Summarizer Settings and the summarize_scene_progress websocket
    handler.'
- path: user-guide/node-editor/reference/nodes/agents-tts.md
  title: Voice Agent Nodes
  summary: 'TTS nodes: Generate TTS (speaks text using an explicit voice or a character''s assigned voice), Get Voice by voice_id,
    Get Narrator Voice, Unpack Voice (label, provider, provider_id, provider_model, tags, is_scene_asset), Unpack Generation
    Emission and Set Chunk Text (read and rewrite the text of an agent.tts.generate.before chunk) and TTS Agent Settings.'
- path: user-guide/node-editor/reference/nodes/agents-visual-generation.md
  title: Visualizer Agent Generation Nodes
  summary: 'Visual generation nodes: Visual Generation Request (vis_type, gen_type TEXT_TO_IMAGE/IMAGE_EDIT/UPLOAD, format,
    reference_assets, asset attachment context), Generate Image, Select Backend, Backend Status (can_generate_images, can_edit_images,
    max_references), Analyze Images, and the request/response unpackers.'
- path: user-guide/node-editor/reference/nodes/agents-visual-modules.md
  title: Visualizer Agent Modules
  summary: 'Ready-made visual flows: Generate Visual Asset, Generate Avatar (set_current_avatar / set_default_avatar), Generate
    Image Edit, Regenerate Visual Asset, Determine Visual References, Set Cover Image From Generation, the legacy character
    portrait module, and the visualize / revisualize / generate_tags websocket handlers.'
- path: user-guide/node-editor/reference/nodes/agents-visual.md
  title: Visualizer Agent Prompt Nodes
  summary: 'Visual prompt building: Visual Prompt Part (keyword lists, "no ..." implied negatives), Visual Prompt (KEYWORDS
    vs DESCRIPTIVE), Apply Style by template_id vs Apply Styles (art style plus vis_type subject style), Finalize Prompt,
    Unpack Visual Prompt and Visual Enum Values. Notes the 0.39.0 Apply Style UNSPECIFIED change.'
- path: user-guide/node-editor/reference/nodes/agents-world-state.md
  title: World State Agent Nodes
  summary: 'Thirteen world-state nodes: Advance Time (duration in seconds, TimePassageMessage), Character Progression (as_suggestions),
    Determine Character Presence, Deactivate Character, Extract Character Sheet, Evaluate Query, State Reinforcement (interval,
    insert_method), Request and Emit World State, and determineCharacterAvatar.'
- path: user-guide/node-editor/reference/nodes/agents.md
  title: Agent Nodes
  summary: 'Generic per-agent nodes: Get Agent, Call Agent Function and its conditional variant, Get / Set / Unset / Counter
    Agent State (scene vs context scope), Toggle Agent Action, and Dynamic Instruction which builds a header/content object
    for prompt injection.'
- path: user-guide/node-editor/reference/nodes/assets-meta.md
  title: Asset Meta And Selection Nodes
  summary: 'Asset metadata and selection: Make Asset Attachment Context (auto-attach to messages, scene/character cover, default/current
    avatar), Make and Unpack Asset Meta, Search Assets (vis_type, character_name, tags with all/any/none matching), Select
    Assets chaining and Unpack Asset Selection Context.'
- path: user-guide/node-editor/reference/nodes/assets.md
  title: Asset Nodes
  summary: 'Scene asset CRUD: Add Asset from a base64 data URL, Get Asset, Get Assets, List Assets, Asset Exists (yes/no routing,
    allow_partial), Remove Asset, Set Cover Image, Set Avatar Image (default or current) and Update Message Assets.'
- path: user-guide/node-editor/reference/nodes/context-id.md
  title: Context ID Nodes
  summary: 'Context IDs address scene context entries generically: Path to Context ID, Context ID Get/Set Value, Character
    Context IDs (attributes, details, acting instructions, example dialogue), Scan and Render Context IDs, Context ID Meta
    Entries, Compress Context ID Part, and Set Pin / Remove Pin / Is Pin Active.'
- path: user-guide/node-editor/reference/nodes/core-functions.md
  title: Function Nodes
  summary: 'Function nodes: Argument, Return, Define Function, Get Function, Call Function, Call For Each (argument_name),
    Error Handler and Unpack Exception, Breakpoint (only pauses in creative mode), Run Module, and Scoped API Function which
    runs python in the quarantined scoped environment.'
- path: user-guide/node-editor/reference/nodes/core-logic.md
  title: Logic Nodes
  summary: 'Branching and comparison nodes: Switch, RSwitch and RSwitch Advanced, AND Router and OR Router (flags a-d), Case
    and Case Router (string match on the value or a named attribute), Coallesce, Invert, Make Bool, As Bool and Apply Default
    for UNRESOLVED.'
- path: user-guide/node-editor/reference/nodes/core.md
  title: Core Nodes
  summary: 'Structural nodes every module graph uses: Input Socket and Output Socket (input_type, optional, group) and Module
    Property define the module''s interface; Stage sets execution order; Route, Watch (logs values in creative mode) and Null.'
- path: user-guide/node-editor/reference/nodes/data-collections.md
  title: Dict And List Nodes
  summary: 'Dict and list nodes: Make Dict, Make List, Dict Get, Dict Get (Path) with dotted paths, Dict Set, Dict Pop, Dict
    Update (shallow vs deep merge, create_copy), Dict To Key-Value Pairs, List Append, List Remove, Combine Lists, Make Key-Value
    Pair, and the dynamic-socket Dict Collector and List Collector.'
- path: user-guide/node-editor/reference/nodes/data-number.md
  title: Number Nodes
  summary: 'Numeric nodes: Make Number, As Number, Basic Arithmetic (add, subtract, multiply, divide, power, modulo), Compare
    with float tolerance, Clamp, Min Max, Sum, Average (mean/median/mode) and Random (uniform, integer, normal or choice).'
- path: user-guide/node-editor/reference/nodes/data-string.md
  title: String Nodes
  summary: 'String nodes: Make String and Make Text, Format, Advanced Format ({name} with dynamic inputs) and Jinja2 Format
    ({{ name }}), Case, Condensed, Excerpt, Extract by left/right anchors, Join, Split, Replace, Substring, Trim, As String
    and String Check (startswith/endswith/contains/exact).'
- path: user-guide/node-editor/reference/nodes/data.md
  title: Data Nodes
  summary: 'General value handling: Get and Set / Set Conditional (getattr, dict key or list index), Update Object with dynamic
    inputs, Contains, Length, Cap Length, Sort by sort_keys, Select Item (random, cycle, sorted_cycle), JSON parsing and UUID
    generation.'
- path: user-guide/node-editor/reference/nodes/event.md
  title: Event Nodes
  summary: 'Emit and listen nodes: Emit Status and Emit Status (Conditional), Emit System Message (title, font_color, icon,
    markdown), Emit Agent Message, Emit Scene Status, Emit World Editor Sync, and the Event node that returns the current
    event object inside an event module.'
- path: user-guide/node-editor/reference/nodes/focal.md
  title: AI Function Nodes (Focal)
  summary: 'FOCAL AI function-calling nodes: AI Function Argument (typed, with instructions), AI Function Callback (allow_multiple_calls,
    allow_concurrent), AI Function Callback Metadata (instructions and examples), AI Function Calling (template or prompt,
    callbacks, agent, max_calls, retries, max_concurrent), Process AI Function Call, Unpack AI Function Call and Collect AI
    Function Call Results.'
- path: user-guide/node-editor/reference/nodes/index.md
  title: Node Reference
  summary: 'Landing page for the node reference: registry paths (e.g. scene/GetCharacter) and links to every category page
    with its node count - agent, focal, asset, context ID, core, data, scene, state, prompt, response, ux, util, validation
    and websocket.'
- path: user-guide/node-editor/reference/nodes/input.md
  title: Input Nodes
  summary: Get Input (input/WaitForInput) which waits for player input in the scene loop, with reason, prefix, allow_commands
    (! prefix) and an abort_condition chain, plus the Process Input module that cleans the text and returns the interaction
    state.
- path: user-guide/node-editor/reference/nodes/prompt.md
  title: Prompt Nodes
  summary: 'Prompt and generation nodes: Build Prompt (include_* context toggles, reserved_tokens, memory_prompt, dedupe_enabled,
    prefill), Prompt From Template (template_file vs template_text, scope), Load Template, Render Prompt, Template Variables,
    Clean Response and Generate Response (action_type, response_length, data_output, response_spec).'
- path: user-guide/node-editor/reference/nodes/raise.md
  title: Flow Exception Nodes
  summary: 'Three exception-raising nodes: Stop (StopGraphExecution, StopModule, LoopBreak, LoopContinue, LoopExit, ExitScene,
    RestartSceneLoop, ResetScene, StageExit), Input Value Error (message and field) and Acted As Character.'
- path: user-guide/node-editor/reference/nodes/response.md
  title: Response Parsing Nodes
  summary: 'Extractor nodes for LLM output plus Response Spec (named extractors, required fields): Anchor and After Anchor,
    nesting-aware Complex Anchor and Complex Code Block, Code Block, Regex (pattern, group, all_matches), AsIs and Strip Prefix,
    all sharing trim and fallback_to_full.'
- path: user-guide/node-editor/reference/nodes/scene-characters.md
  title: Scene Character Nodes
  summary: 'Eighteen character nodes: Get Character (partial match), Get Player Character, List Characters (active/inactive/all),
    Make Character, Activate and Deactivate, Remove Character and Remove All Characters, Is Player / Is Active checks, Get
    and Set Character Attribute, Detail and Description, Unpack Character, and Update Character Data (including renaming).'
- path: user-guide/node-editor/reference/nodes/scene-history.md
  title: Scene History Nodes
  summary: 'History nodes: Push History and Pop History, Get Message By ID, Last Message of Type (stop_on_time_passage), Scene
    Has History, Context History (token budget, keep_* flags, min_dialogue_length, label_chapters), Character Activity, and
    the static archive entry nodes with Unpack Archive Entry.'
- path: user-guide/node-editor/reference/nodes/scene-intent.md
  title: Scene Intent Nodes
  summary: 'Scene intention nodes: Get Scene Intent (intent, phase, scene_type, start, direction_always_on / run_immediately
    / instructions), Set Scene Intent and Set Scene Phase, Get / Make / Remove Scene Type, Get Scene Types, Is Scene Phase
    Active, and the Unpack Scene Phase and Unpack Scene Type nodes.'
- path: user-guide/node-editor/reference/nodes/scene-messages.md
  title: Scene Message Nodes
  summary: 'Message-object nodes: Character Message (auto "Name: " prefix, avatar capture), Narrator Message, Director Message
    (action, subtype, meta), Add Message Version which appends to the revision stack, Toggle Message Context Visibility (hide
    from the AI) and Unpack Message Meta.'
- path: user-guide/node-editor/reference/nodes/scene-world-state.md
  title: World Entry Nodes
  summary: 'World entry nodes: Get World Entry and Get World Entries (id filter, raise_on_missing), Save World Entry (text,
    meta, create_pin), Remove World Entry and Unpack World Entry, plus the generation-option nodes Generation Options, Spices
    (spice_level) and Writing Style.'
- path: user-guide/node-editor/reference/nodes/scene.md
  title: Scene Nodes
  summary: 'Scene lifecycle and metadata nodes: Scene Loop and Creative Loop, the Game Loop Actor Iteration trigger, Select
    Actor For Turn, Restore Scene, Get and Set Title, Description, Introduction and Content Classification, Get Scene State
    and Get Scene Loop State, Unpack Interaction State, and the Dynamic Storyline / Generate Storyline modules.'
- path: user-guide/node-editor/reference/nodes/state.md
  title: State Nodes
  summary: 'Fourteen state nodes: Get / Set / Unset / Has State and their "(Path)" dotted-path variants, State Counter with
    increment, reset and reset_cap, the Conditional Set / Unset / Counter variants that require a state input, and Game State.
    Scopes: local, parent, shared, scene loop, game.'
- path: user-guide/node-editor/reference/nodes/util-packaging.md
  title: Packaging Nodes
  summary: The Package graph node (package_name, author, description, installable, restart_scene_loop) with Install Node Module
    and Promote Config (node_registry, property_name, exposed_property_name, required, label), plus the shipped Dynamic Storyline
    package module.
- path: user-guide/node-editor/reference/nodes/util.md
  title: Utility Nodes
  summary: 'Utility nodes: Counter (increments a key in a dict), Diff (plain text or inline HTML), Extract List (numbered
    or bulleted lists from LLM text), Duration (amount and unit to a number of seconds) and Module Style (title colour, icon).'
- path: user-guide/node-editor/reference/nodes/ux.md
  title: UX Nodes
  summary: 'UX element nodes: Build Choice Element (choices, multi_select, timeout_seconds, closable), Build Text Input Element
    (multiline, rows, placeholder), Build Notice Element, Style UX Element (tint, mdi icon, apply_scene_colors) and Emit UX
    Element which awaits submit/cancel and returns cancelled and timed_out.'
- path: user-guide/node-editor/reference/nodes/validation.md
  title: Validation Nodes
  summary: 'Seven validators that raise an error on failure with a "{value}" error_message: Validate Value Is Set (blank_string_is_unset)
    and Is Not Set, Validate Value Contained, Validate Character (create_placeholder), Validate Asset ID, Validate Context
    ID String / Context ID Item.'
- path: user-guide/node-editor/reference/nodes/websocket.md
  title: Websocket Nodes
  summary: 'Nodes for module-defined websocket handlers: Get Websocket Router by route name, Websocket Response (action name
    plus a data payload dict), Websocket Operation Done (signal_only, allow_auto_save, status message) and Websocket Operation
    Failed.'
- path: user-guide/node-editor/reference/template_functions.md
  title: Template Functions
  summary: 'Functions available inside jinja2 prompt templates: set_prepared_response and set_data_response scaffolding, disable_dedupe,
    query_scene, query_memory, query_text, query_text_eval, instruct_text, agent_action, agent_config, time_diff, text_to_chunks,
    count_tokens, llm_can_be_coerced and the `condensed` filter.'
- path: user-guide/node-editor/reference/useful-template-patterns.md
  title: Template Pattern Cheat Sheet
  summary: 'Copy-paste jinja2 prompt snippets: scene history via scene.context_history(budget=...), memory via agent_action("narrator",
    "rag_build"), character context with filtered_sheet and query_memory, the scene-context / memory-context / character-context
    / extra-context templates, token-budget conditionals, and bot_token / set_prepared_response scaffolding.'
- path: user-guide/playthrough.md
  title: Playthrough Mode
  summary: Replaying a scene from the beginning one message at a time - starting it from the Playthrough quick-settings chip,
    advancing by click, space or the Advance button, the scrubber, the chapter menu built from time passages, the narration
    and auto-advance toggles, forking the story from the revealed message into a new scene, which surfaces the mode puts
    away while it runs, and how a playthrough resumes where it was left off.
- path: user-guide/prompts/context-history-review.md
  title: Scene Context History Review
  summary: The Prompt Manager's Scene Context tab, rendering scene history as color-coded Layered History / Archived / Dialogue
    sections with token, entry and budget counts. Documents Best Fit mode, Dialogue Ratio, Summary Detail Ratio, Enforce Boundary
    and Max Budget.
- path: user-guide/prompts/deduplication.md
  title: Prompt Deduplication
  summary: 'The line-level fuzzy dedupe pass controlled by the per-client Deduplicate Prompts toggle in the Advanced section.
    Recommends leaving it off because it breaks prompt caching, and shows the opt-outs: disable_dedupe() and the Prompt from
    Template node''s property.'
- path: user-guide/prompts/index.md
  title: Prompt Manager
  summary: 'Overview of the Prompt Manager and its Prompts, Template Files, LLM Prompt Templates and Scene Context tabs: Jinja2
    template groups (default, user, scene, custom) and their priority, the resolved template tree with override indicators,
    and Test Changes.'
- path: user-guide/prompts/llm-prompt-templates.md
  title: LLM Prompt Templates
  summary: 'The Prompt Manager tab for base chat-format templates (ChatML, Llama3, Mistral, Gemma4): built-in templates/llm-prompt/std/
    vs update-safe user templates, creating, copying and deleting them, pasting GGUF chat templates, and assigning one to
    a client.'
- path: user-guide/prompts/redefining-response-extraction.md
  title: Redefining Response Extraction
  summary: Overriding a template's default AsIsExtractor with set_anchor_extractor / set_as_is_extractor / set_after_anchor_extractor
    in the template body, worked through a dialogue example using <ANALYSIS> and <DIALOGUE> tags. Covers tracked_tags and
    fallback_to_full.
- path: user-guide/prompts/volatile-context-placement.md
  title: Volatile Context Placement
  summary: Moving volatile context (RAG memory, dynamic notes) after the scene history to preserve provider prompt caches,
    via the per-client 'Optimize for Prompt Caching' toggle in the Advanced section and the per-agent Auto/On/Off override.
    Includes when not to enable it.
- path: user-guide/restoring-scenes.md
  title: Restoring Scenes
  summary: Restoring scenes with the non-destructive Timeline or a configured restore point. Covers previewing and forking
    changelog revisions, chain-health warnings and repair, reconstruction limits for world state, and resetting to a baseline
    save without overwriting the current scene or restore-point file.
- path: user-guide/saving.md
  title: Saving
  summary: How scene saves work - .json files in the scene project directory with an automatic changelog version history.
    Covers saving from the scene tools or world editor, the auto save toggle, locked save files, Save As for checkpoints and
    restore points, and forking.
- path: user-guide/scenario-tools.md
  title: Scene Tools
  summary: 'Reference for the scene toolbar and quick settings: agent activity, auto-save/progress, immersive backdrop, playthrough,
    regenerate/nuke, actor/director/narrator actions, time passage, tracked world states, character activation and creation,
    custom commands, visual generation, saving, and reusable action shortcuts.'
- path: user-guide/scene-browser.md
  title: Home Screen & Scene Library
  summary: Tour of the Home screen - Quick load cards with their Timeline / Remove / Delete menu, the Scene Library tree of
    scene projects and save files with filtering and character cards, the Import dropzone for .json/.zip scenes and .png/.webp
    cards, and Create new scene.
- path: user-guide/scene-directory.md
  title: Scene Directory Structure
  summary: What lives in a scene's project directory under scenes/ - the .json save files plus assets/ (images and TTS audio),
    changelog/ (snapshots and deltas powering the Timeline), nodes/ (node editor graphs), templates/, shared-context/ and
    info/.
- path: user-guide/scene-state-reset.md
  title: Reset Scene State
  summary: The Reset Scene State dialog for selectively clearing scene internals without touching character or world definitions
    - Context DB (reimport of the vector memory), History (messages, archived summaries and layered history), Intent State,
    Agent States and Reinforcements.
- path: user-guide/templates/attribute.md
  title: Character Attribute
  summary: 'Creating a Character attribute world-state template used by the World Editor''s Character Attributes section:
    template name and type, Attribute name, Priority (generation order), description, Additional instructions with {character_name},
    and Supports spice.'
- path: user-guide/templates/detail.md
  title: Character Detail
  summary: 'Creating a Character detail world-state template used by the World Editor''s Character Details section: template
    name and type, the Question / Statement field (questions work best), description, Additional instructions, Supports spice
    and Favorite.'
- path: user-guide/templates/groups.md
  title: Groups
  summary: Template groups are the containers all world-state templates live in. Covers creating one with the Create Group
    button (name, author, description) and removing it with Remove Group from the Templates list in the left sidebar.
- path: user-guide/templates/index.md
  title: Templates
  summary: 'Overview of the Templates tab and the template types available: Character Attribute, Character Detail, Spices,
    Writing Style, State Reinforcement, Scene Type, Visual Style, Visual Prompt Finalizer, Agent Persona, Scene Tool Shortcut
    and Theme. Templates live in groups shared across scenes. Also covers asking the help chat to create or change a template,
    and what stays in the tab: applying, installing and deleting.'
- path: user-guide/templates/scene-tool-shortcut.md
  title: Scene Tool Shortcuts
  summary: 'Creating a Scene tool shortcut template that packages a scene tool action with a label, an icon and canned instructions:
    the Action, Label, Instructions and Icon fields, installing it into the scene tools menu with Install shortcut (duplicates
    are skipped, templates whose action no longer exists are blocked), and sharing it by passing on the group file in templates/world-state.'
- path: user-guide/templates/scene_type.md
  title: Scene Types
  summary: Creating a Scene type template - name, type, description, and the scene type instructions that govern the director's
    actions when that scene type is played, plus Favorite. Warns it is early WIP and consumed by the World Editor's Scene
    Direction section.
- path: user-guide/templates/spice.md
  title: Spice Collection
  summary: 'Creating a Spice collection template that injects randomness into attribute and detail generation: description,
    Additional instructions built around the {spice} variable, adding spice values by hand or with the Generate dialog, and
    the Spice picker.'
- path: user-guide/templates/state.md
  title: State Reinforcement
  summary: 'Creating a state reinforcement template for automatically tracked character and world states: the question or
    attribute name, description, State Type (All Characters, Player Character, World), Context Attachment Method, and update
    every N turns.'
- path: user-guide/templates/themes.md
  title: Themes
  summary: Theme templates define 51 color slots across Surfaces, App, Messages and Chats, plus message/markup styling, Light/Dark
    mode and a code-editor palette. Covers authoring with the click-to-edit preview and eyedropper, applying themes (colors
    read live; styling copied), asking the help chat to create or change a theme, Reset to template, locked shipped themes,
    Appearance overrides, group-file sharing, and the node-editor canvas limitation.
- path: user-guide/templates/visual-finalizer.md
  title: Visual Prompt Finalizer
  summary: Creating a Visual prompt finalizer template - a reusable table of post-processing actions (exact, fuzzy or regex
    match-and-replace, or an AI instruction) that rewrite image generation prompts. Covers the Actions field and the shipped
    Ideogram JSON preset.
- path: user-guide/templates/writing-style.md
  title: Writing Styles
  summary: 'Creating a Writing style template: description, the writing style instructions passed to the AI, Favorite, and
    Phrase Detection which lists unwanted phrases matched by regex or semantic similarity for the Editor agent''s Revision
    actions.'
- path: user-guide/time-passage.md
  title: Time Passage Management
  summary: Time passage markers - inserting them from the Advance Time menu presets or Custom dialog, giving them an optional
    chapter title, editing the duration and title in the scene view or the World State Manager history, deleting them, and
    how they drive separate summarization and clear actor directions.
- path: user-guide/tracking-a-state.md
  title: Tracked states
  summary: 'What tracked states are - periodic re-inforcement of a character''s or the world''s state kept in the AI context
    - where to set them up (character editor, world editor), favorited state templates, and the four Context Attachment Methods:
    Passive, Sequential, Conversation Context and All Context.'
- path: user-guide/visual-library.md
  title: Visual Library
  summary: Snippet-include stub rendering the Visual Library page from the visualizer agent docs - managing generated images
    from the toolbar image icon, the Queue vs Scene Assets sections, and the Text to Image / Image Edit / Image Analysis backend
    capability indicators.
- path: user-guide/voice-library.md
  title: Voice Library
  summary: Snippet-include stub rendering the Voice Library page from the voice agent docs - the unified hub for managing
    voices across all TTS providers, opened from the voice icon in the app bar and requiring the voice agent to be enabled.
- path: user-guide/world-editor/characters/actor.md
  title: Actor management
  summary: 'The AI-only Actor tab of the character editor: Dialogue Instructions for how the character acts and speaks, with
    an AI Generate button, and Dialogue Examples added one line at a time with ctrl+Enter autocomplete. Spoken words must
    use straight quotes.'
- path: user-guide/world-editor/characters/attributes.md
  title: Attributes
  summary: 'The character editor''s Attributes tab: adding an attribute via the New attribute input, editing and removing
    attributes, and bulk-generating from attribute templates using the Templates button, per-template checkboxes and Generate
    Selected.'
- path: user-guide/world-editor/characters/create.md
  title: Character creation
  summary: 'Reference for the Create New Character dialog in the World Editor''s Characters tab, field by field: Enable AI
    Generation, AI Generation Instructions, Name, Description, Generate Attributes, Generate Example Dialogue and Controlled
    by Player. Mentions the Creator agent''s Fast Character Generation mode.'
- path: user-guide/world-editor/characters/deactivate.md
  title: Activate and Deactivate Characters
  summary: How to temporarily take a character out of the scene and bring them back with the Deactivate and Activate buttons
    beneath the character portrait in the Characters tab. Instant and without narration, unlike the equivalent scene tools
    actions.
- path: user-guide/world-editor/characters/delete.md
  title: Delete character
  summary: 'How to permanently remove a character from a scene: select the character in the World Editor''s Characters tab,
    click the Delete button beneath the portrait, and confirm by typing the character''s name into the confirmation field.'
- path: user-guide/world-editor/characters/description.md
  title: Description
  summary: The character editor's Description tab - a short to medium description of the character's defining characteristics,
    personality, background and motivations. Changes apply as you type but need a scene save if auto-save is off; supports
    Generate and autocomplete.
- path: user-guide/world-editor/characters/details.md
  title: Details
  summary: 'The character editor''s Details tab: adding details via the New detail input, editing and removing them, wiring
    a detail to a tracked state with Setup Auto State, pinning one into the AI context with Add pin, and bulk-generating from
    detail templates.'
- path: user-guide/world-editor/characters/folders.md
  title: Folders
  summary: 'Organizing the character list sidebar into collapsible folders: assigning a character via the folder input at
    the top of the character editor, clearing it to ungroup, renaming a folder from the sidebar''s pencil icon, and per-scene
    expand and collapse memory.'
- path: user-guide/world-editor/characters/import.md
  title: Import character
  summary: 'How to import a character from another Talemate scene: in the World Editor''s Characters tab click Import character,
    pick the source scene and character in the dialog, then click Import.'
- path: user-guide/world-editor/characters/index.md
  title: Character Editor
  summary: Overview of the World Editor's Characters tab and the components a character is made of, linking to Attributes,
    Details, Description, Tracked states, Actor management and Visuals. Also covers deactivating characters, changing the
    player character, and folders.
- path: user-guide/world-editor/characters/player.md
  title: Make or Unmark a Player Character
  summary: 'How to change which character the player controls: the Player and AI chips in the character list, the Make Player
    Character button (which demotes the previous player and auto-activates a deactivated character), and the Unmark as Player
    button.'
- path: user-guide/world-editor/characters/states.md
  title: Tracked states
  summary: 'Per-character tracked states (state reinforcements) in the character editor''s States tab: creating one from the
    New state input, the reinforcement interval in turns, Context Attachment Method, Additional Instructions, and the Refresh
    State and Reset State buttons.'
- path: user-guide/world-editor/characters/visuals.md
  title: Character Visuals
  summary: 'The character editor''s Visuals tab and its sub-tabs: Cover Image and Portrait (drag-and-drop, Generate from Reference,
    Generate New, batch mode, Set as Cover or Default or Current), Rules for static visual traits, and character-level Prompt
    Finalization. Covers tag-driven automatic portrait selection.'
- path: user-guide/world-editor/context-db.md
  title: Context DB
  summary: 'The read-only Context DB browser for the Memory agent''s vector store: embedding-based search, the Search Strictness
    slider (0.1-2.0, default 1.0) which writes distance_mod to the active embedding preset, manually adding entries, and the
    Reset tool that rebuilds the database.'
- path: user-guide/world-editor/generation-settings.md
  title: Generation Settings
  summary: 'The world editor''s generation settings bar: ctrl+click Generate for an Instructions dialog, the Generation Length
    dropdown from Tiny (8 tokens) to Complete (1024) remembered per context type, applying writing style templates, and spice
    collection templates with the Spice Chance control.'
- path: user-guide/world-editor/history/index.md
  title: History
  summary: 'The World Editor''s History tab: the three entry types (static archived, summary archived, layered), editing entries
    by double-click, deleting, regenerating and inspecting them, adding static entries with Entry Text plus Unit and Amount
    duration, time passage entries with their duration and playthrough chapter title (the only surface that reaches a passage
    inserted before a summarized entry), and Regenerate All History.'
- path: user-guide/world-editor/history/layered-history.md
  title: Layered History
  summary: 'Conceptual explanation of layered history: base layer static and summary entries, higher layers compressing further
    (useful up to about Layer 3), and the resulting detail gradient in the AI context. Covers compression statistics and the
    Summarizer agent settings that configure it.'
- path: user-guide/world-editor/pins.md
  title: Pins
  summary: 'Pinning context entries so the AI always considers them: creating pins from the Context editor or a character
    detail, toggling Pin active, and the two automation modes - AI Prompt conditions evaluated by the World State agent, and
    Game State conditions built from condition groups and state paths.'
- path: user-guide/world-editor/scene/direction.md
  title: Direction
  summary: 'The Scene tab''s Direction panel where you set story intent used by the Narrator and the director''s Autonomous
    Scene Direction: scene-specific Director Instructions, the Overall Intention, and the Current Phase (Scene Type template
    plus Current Scene Intention).'
- path: user-guide/world-editor/scene/export.md
  title: Export
  summary: 'The Scene tab''s Export panel: choosing between Talemate Scene (JSON only) and Complete Scene Package (ZIP with
    assets, nodes, info, templates and per-scene agent settings), setting the export file name, and the Reset progress option.'
- path: user-guide/world-editor/scene/game-state.md
  title: Game State
  summary: 'The Scene tab''s Game State editor: a JSON editor for the scene''s persisted game state variables, saved when
    you click outside and rejected if invalid, plus a Pinned Variables manager with independent Debug Vars and Scene toolbar
    targets, optional shared labels, an Add action, and per-row label and target controls. Documents the per-path control
    settings dialog - label, description shown as a tooltip on the knob or Debug Vars control, order, read-only, number
    minimum, maximum, step and slider, string choices - which settings are enforced limits, which of them expanded children
    inherit (label, description, order and read-only, but never the value limits), and that the JSON editor and SetState stay
    unlimited. These variables are the node editor''s game scope.'
- path: user-guide/world-editor/scene/outline.md
  title: Outline
  summary: 'The Scene tab''s Outline panel: Title, Content Classification, the four perspective-and-tense fields (scene default
    plus player, other and narrator overrides, with the {player_name} placeholder and shipped presets), the internal Description,
    and the player-facing Introduction.'
- path: user-guide/world-editor/scene/settings.md
  title: Settings
  summary: 'The Scene tab''s Settings panel: selecting a writing style template, the Locked save file flag, the Experimental
    tag, Restoration Settings for designating a restore point and using Restore Scene, and the Agent settings file dropdown
    for per-scene agent overrides.'
- path: user-guide/world-editor/scene/shared-context.md
  title: Shared World & Episodes
  summary: 'The Scene tab''s Shared World panel: creating a shared context file, linking a scene to it, bulk sharing characters
    and world entries, and creating new scenes that inherit it. Also covers Episodes (alternative introductions) and marking
    items as Shared to World Context.'
- path: user-guide/world-editor/scene/visuals.md
  title: Scene Visuals
  summary: 'World Editor Scene Visuals tab: manage background illustrations, scene illustrations and scene cards (upload,
    Generate New, Generate Variation with batch prompts), set the scene cover image, set/unset the scene backdrop with the
    Render backdrop switch, and edit the visualizer agent''s per-scene Prompt Finalization overrides.'
- path: user-guide/world-editor/suggestions.md
  title: Suggestions
  summary: The Suggestions view where agents collect proposed world changes (currently only character changes). Covers requesting
    proposals manually with the Suggest Changes button in the character editor and reviewing new proposals.
- path: user-guide/world-editor/world/states.md
  title: Tracked states
  summary: 'Scene-wide tracked states created from the World tab''s New State Reinforcement button: the question or state
    description, an optional pre-specified value, the update interval in turns, Context Attachment Method and Additional Instructions,
    plus Reset State Reinforcement.'
- path: user-guide/world-state.md
  title: World State
  summary: The world state snapshot panel maintained by the World State Agent - character entries with emotional state and
    Look at / Manage Character / Make real shortcuts, object entries and tracked states, clickable entity highlights, manual
    refresh, durable carry-forward and the Pin to context setting.
