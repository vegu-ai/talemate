    frontend rebuilds and Docker runtime URL discovery.
- path: getting-started/advanced/debug-logging.md
  title: Debug Logging
  summary: Enable DEBUG logging with TALEMATE_DEBUG=1 on Linux or Windows, including rotating logs/errors.log files with a
    10 MB limit and five backups. Documents disabling debug mode and manual server launch examples.
- path: getting-started/advanced/environment-variables.md
  title: Environment variables
  summary: Startup variables for networking, Docker WebSocket discovery, TALEMATE_DEBUG, TALEMATE_LOG_PROMPTS and TALEMATE_PI_BRIDGE_TRACE.
