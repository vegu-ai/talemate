author: Talemate
description: Default world state templates.
name: default
templates:
  0802e774-74d5-4d41-9e7a-78744e66f09e:
    decision_checks:
    - active: true
      name: Repeated beats and description reuse
      questions:
      - false_criteria: The passage adds a new action, fact or development; necessary
          continuity or recurring subjects alone are not repetition.
        id: repetition
        instructions: Remove this repeated beat, or replace it with genuinely different
          content if repetition handling is set to rewrite.
        kind: repetition
        question: Does passage {passage_id} repeat information, an action, observation
          or story beat already conveyed in preceding history or earlier passages of
          the current text? Judge meaning, not shared words. For summarization or contextual
          generation, overlap with source_context or summarization_history is expected
          evidence, not itself repetition; flag only redundant retelling within the
          draft.
        true_criteria: The passage restates an already conveyed beat without a meaningful
          new development.
      - false_criteria: No reuse of distinctive phrasing or imagery; shared names, common
          words, or necessary factual continuity alone do not count.
        id: description_reuse
        instructions: Replace the reused description with fresh wording or a different
          image. Preserve the event and factual content; do not remove the event merely
          because its description was reused.
        kind: repetition
        question: Does passage {passage_id} reuse a distinctive phrase, image, or description
          already used in the history or an earlier current passage? Reuse may be near-verbatim,
          paraphrased, or applied to a new occurrence; shared names, ordinary words,
          and factual continuity alone do not count. For summarization or contextual
          generation, overlap with source_context or summarization_history is expected
          evidence, not itself description reuse; flag only redundant reuse within the
          draft.
        true_criteria: Substantially the same distinctive wording or image is reused,
          even if this describes a new occurrence of the action.
      requires_style: false
      scope: all
      threshold: 0.8
    - active: true
      name: Writing style and unwanted prose
      questions:
      - false_criteria: The passage follows the applicable instructions. Vivid detail,
          atmosphere or dialogue is not a violation on its own.
        id: style
        instructions: Follow the writing style and active prose rules; preserve factual
          content.
        kind: style
        question: Does passage {passage_id} violate the supplied writing_style or an
          active prose_rule? Evaluate the passage in its complete current text and task
          context. The prose rules include the director's intended corrections; judge
          their meaning, not just matching words.
        true_criteria: The passage conflicts with an explicit writing-style instruction
          or exhibits unwanted prose described by an active rule.
      requires_style: true
      scope: all
      threshold: 0.8
    - active: true
      name: Repeated dialogue and behavioural tics
      questions:
      - false_criteria: A first or second use; words that another character said; a
          name or form of address, a common word, a deliberate callback or quotation,
          or a story motif that the text repeats on purpose.
        id: dialogue_tic
        instructions: Rewrite this line so that the character does not repeat the habit;
          keep what the character means.
        kind: repetition
        question: 'Does passage {passage_id} repeat a verbal habit of its speaker: a
          statement, catchphrase or filler phrase (the same or nearly the same words)
          that the same character keeps using in the preceding history or earlier in
          the current text? The history names the speaker before each character line,
          and `speaker` names the speaker of the current text.'
        true_criteria: 'The same character comes back to the same words so often that
          it reads as a tic: this passage is at least the third use by that character,
          counting the history and the current text.'
      - false_criteria: A first or second time; a gesture of another character; a common
          action the moment needs (nodding, sitting down, walking); or a deliberate
          callback.
        id: mannerism_tic
        instructions: Replace the repeated gesture with a different beat, or remove
          it; keep the action the moment needs.
        kind: repetition
        question: 'Does passage {passage_id} repeat a gesture or mannerism of a character:
          the same physical habit, expression or movement that the same character keeps
          showing in the preceding history or earlier in the current text? The history
          names the speaker before each character line, and `speaker` names the speaker
          of the current text.'
        true_criteria: 'The same character shows the same gesture or mannerism so often
          that it reads as a tic: this passage is at least the third time for that character,
          counting the history and the current text.'
      requires_style: false
      scope: all
      threshold: 0.8
    - active: true
      name: Overdescription and filler prose
      questions:
      - false_criteria: 'No when every detail does work: it tells things apart, sets
          the scene, moves the action or builds tension, even when vivid or stacked.
          A short beat such as a silence or a pause that sets the rhythm is not filler.
          A repeated gesture is a separate problem, not overdescription.'
        id: overdescription
        instructions: 'Cut the padding: keep the detail that serves the moment and remove
          the modifiers and filler it does not need.'
        kind: style
        question: Is passage {passage_id} overwritten for its moment? Ask whether a
          sentence, or several of its words, could be cut without losing any action,
          fact, character detail or tension the moment needs, and whether the passage
          would then read faster and better. Stacked adjectives, several images for
          one thing and sentences that only restate a mood are common forms of this
          excess, but only when they add nothing the moment needs.
        true_criteria: Yes when the passage carries description or filler that could
          be cut or shortened without losing anything the moment needs; one such cut
          is enough.
      requires_style: false
      scope: prose
      threshold: 0.5
    description: 'Mid-90s point-and-click adventure game: second-person narration, short
      look-at descriptions, wry humour, characterful dialogue.'
    favorite: false
    group: talemate_default_467c7fe3
    instructions: 'Write like the text of a mid-90s point-and-click adventure game.

      When you narrate:

      - Address the protagonist as "you", in the present tense.

      - Describe a place or an object the way a look-at description does: a few short,
      concrete sentences, not a paragraph of atmosphere.

      - Name the things that can be used, taken, opened, combined or talked to, and
      give an odd object one specific detail that hints at what it is for.

      - Add at most one wry aside per passage: dry understatement, an absurd detail
      treated as normal, or a joke at your expense. The facts and the danger stay real.

      In dialogue:

      - Give every character a distinct, exaggerated voice with their own attitude,
      habits and running gags. Keep exchanges quick, with comic timing.

      - Characters hint at solutions and answer in character; they do not explain the
      puzzle.

      Avoid purple prose, long atmospheric paragraphs, modern slang, and any mention
      of game mechanics, verbs, menus, inventory screens or a player.'
    name: Adventure Game
    phrases: []
    priority: 1
    template_type: writing_style
    uid: 0802e774-74d5-4d41-9e7a-78744e66f09e
  4e4aea77-c414-47c8-ab65-2955e0bbbd17:
    description: Default Talemate spice mix.
    favorite: false
    group: talemate_default_467c7fe3
    instructions: Your response should add {spice} to {character_name}'s character
      profile.
    name: Spice Mix
    priority: 1
    spices:
    - some sadness
    - some darkness
    - some humor
    - a little silliness
    - some grit
    - an unlikeable trait
    - a likeable trait
    - a charming side
    - a rude side
    - some cuteness
    - some weirdness
    - a quirky trait
    template_type: spices
    uid: 4e4aea77-c414-47c8-ab65-2955e0bbbd17
  571e0e4a-b985-45ff-b6a3-d3c044eab891:
    description: Freeform dialogue between one or more characters with occasional
      narration.
    favorite: false
    group: talemate_default_467c7fe3
    instructions: null
    name: Roleplay
    priority: 1
    template_type: scene_type
    uid: 571e0e4a-b985-45ff-b6a3-d3c044eab891
  e121080a-f7a4-4931-8004-1b31b0747f73:
    description: Nexus the sci-fi enthusiast.
    favorite: false
    group: talemate_default_467c7fe3
    initial_arc_chat_message: Alright, let's map this story arc out. I'll sketch the beats
      first, then we'll bring each one to life.
    initial_chat_message: Alright — what are we making? I'm a sucker for spaceships
      and rogue AIs, but I'll bring the energy to whatever you throw at me.
    instructions: "You are Nexus, the director of this roleplaying experience. You're\
      \ a sci-fi nerd at heart, and you bring enthusiasm and energy to every session.\n\
      \nSpeak with excitement and don't hide when something cool happens. Drop sci-fi\
      \ references regularly\u2014it's part of your charm. Weave in quotes, callbacks,\
      \ and playful nods to classic and modern sci-fi. You're a fellow nerd facilitating\
      \ this story, not some distant authority figure. Paint vivid scenes and lean\
      \ into atmospheric details.\n\nYou love when players make bold, creative choices\
      \ or unexpected decisions. Morally complex situations with no easy answers thrill\
      \ you. You're always looking for organic ways to reveal lore and build the world.\
      \ When players connect dots from earlier in the story, you can barely contain\
      \ yourself. Character growth and meaningful stakes matter deeply to you."
    name: Nexus
    priority: 1
    template_type: agent_persona
    uid: e121080a-f7a4-4931-8004-1b31b0747f73
