fixed:
- "A world entry that one scene shares to its shared world now appears in the other linked scenes when they are loaded. Before, a normal load dropped it, and the next save of that scene removed it from the shared world."
- "A shared world that an earlier version wrote gets back the shared entries that this bug took out of it. When a linked scene is loaded and holds a shared entry that the shared world lacks, the entry goes back into the shared world, until this version first writes the shared world: a save of a linked scene (an auto save counts), a change to Share static history, or a load that puts an entry back. So a lost entry comes back only if the scene that holds it is loaded before that first write. The repair cannot tell a lost entry from one that a linked scene unshared or deleted on the earlier version; such an entry also goes back, and every linked scene takes it at its next load. An edit that the bug overwrote with an older text stays overwritten; the edited text is in that scene's older revisions."
changed:
- "Loading a scene linked to a shared world now applies the shared world entries, as selecting the shared world in the World Editor already did. A shared entry replaces a private entry with the same ID, and a shared entry that the shared world no longer holds is removed from the scene."
- "The answers of a state tracked with the Sequential method now collect in the scene history. A new answer replaces the previous one only when the previous answer is among the last 10 messages, for example after a short interval or a manual refresh. With the default interval of 10 rounds, each answer stays. Before, every new answer removed the previous one wherever it was."
