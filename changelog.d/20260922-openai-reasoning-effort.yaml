added:
  - "Added reasoning effort controls for OpenAI and OpenAI-compatible clients, with a choice of request format for compatible servers (#738)."
  - "Added a completion token parameter choice for both OpenAI clients, plus sampler, system-message and streaming toggles for the native OpenAI client."
changed:
  - "Refreshed the static OpenAI model suggestions with current chat models and removed unavailable entries and dated snapshots. Saved model names and manual entry still work (#754)."
  - "OpenAI clients now lock Reasoning on for model names starting with gpt-5 or gpt-6, including during agent-action overrides. Saved token and effort values are retained; other models keep their Reasoning toggle (#753)."
  - "Clarified that reasoning tokens on OpenAI clients provide extra completion allowance rather than a separate thinking budget."
  - "New OpenAI clients start with Reasoning enabled and 1024 Extra Completion Tokens; existing clients retain their saved token and effort values."
  - "OpenAI sampler toggles now default off, including for saved clients without toggle values. Enable Send temperature, Send top_p or Send presence_penalty to use preset values on models that support them."
  - "After upgrading from 0.39, saved gpt-5/gpt-6 OpenAI clients have Reasoning locked on. For o-series clients, enable Reasoning if it is off to leave room for thinking; Adaptive then omits the token cap. For o1-mini/o1-preview, turn Send System Message off. Turn Stream off if your organization cannot stream, and choose max_tokens for override servers that require it. Save these settings."
fixed:
  - "Allowed manually entered OpenAI model names to use a fallback token estimate."
  - "OpenAI requests default to max_completion_tokens and honor explicit sampler, system-message, streaming and token-parameter settings (#740)."
