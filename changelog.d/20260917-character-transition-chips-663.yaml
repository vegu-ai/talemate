added:
- "Activating or deactivating a character adds a \"Name activated\" or \"Name deactivated\" chip to scene history in every scene, in the character's color. Clicking an activated chip shows a short summary of the arrival (time away, who was present, the Offscreen Life account) and, while transitions are on, the Arrival Note field, which saves when you leave it. Creating a character adds no activated chip; when the Director creates a character who has not arrived yet, a deactivated chip appears at creation."
