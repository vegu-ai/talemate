    for local APIs, and the pi agent.'
- path: getting-started/installation/linux.md
  title: Linux
  summary: 'Linux install: python plus uv, then clone, ''source install.sh'' (optionally with CUDA pytorch) and ''source start.sh'';
    install.sh downloads a portable Node.js 22. Also the manual path - uv venv, uv pip install -e ''.[dev]'', run.py runserver
    and corepack pnpm.'
- path: getting-started/installation/troubleshoot.md
  title: Common issues
  summary: 'Install troubleshooting: Windows frontend failures from special characters in the path, Docker creating a config.yaml
