added:
- "Decision Model: A new settings page beneath the LLM clients configures one optional decision model — a model that answers typed questions with a probability instead of prose. It is off until you turn it on, on the settings page or with the power button on its sidebar entry, reuses your OpenRouter API key without storing a second copy, and takes an editable model ID and a time limit. A green-dot Configured state shows when the setup is complete. Nothing is sent while it is off, and a failed request leaves the feature that asked it running as if the service were off."
