added:
- "Scene header: an optional Active characters item shows the characters in the scene as small round portraits, or as the first letter of the name on the character's name color. Hover for the name, click to open the character in the World Editor; extra characters collapse into a +N circle."
- "Scene header: an optional Knowledge effort item shows the character knowledge effort of the scene's story mode as a chip, with the full explanation on it (hover or keyboard). A click opens the knowledge hub for the scene: the story mode, the effort slider and the individual settings, without the part about one character. A stop picked there is saved as a scene override, like the slider in a character's knowledge hub, and a change that waits for a scene save is saved or discarded in the same popup."
- "Both new scene header items are off by default. Add them to either side of the title with the header's edit button or in Settings > Game > General (Left of the title / Right of the title)."
