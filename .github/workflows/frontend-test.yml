name: Frontend Tests

on:
  push:
    branches: [ main, 'prep-*' ]
  pull_request:
    branches: [ main, 'prep-*' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # before setup-node, so it can query pnpm for the cache directory. The
    # frontend steps run beside package.json, where Corepack enforces its pin.
    - name: Enable corepack
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: talemate_frontend/pnpm-lock.yaml

    - name: Verify pnpm version
      working-directory: talemate_frontend
      run: test "$(pnpm --version)" = "12.4.1"

    - name: Install dependencies
      working-directory: talemate_frontend
      run: pnpm install --frozen-lockfile

    - name: Run lint
      working-directory: talemate_frontend
      run: pnpm lint

    - name: Run tests
      working-directory: talemate_frontend
      run: pnpm test
