name: Frontend Tests

on:
  push:
    branches: [ main, 'prep-*' ]
  pull_request:
    branches: [ main, 'prep-*' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # before setup-node, so its pnpm cache resolves the version pinned in
    # talemate_frontend/package.json (`packageManager`)
    - name: Enable corepack
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: talemate_frontend/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: talemate_frontend
      run: pnpm install --frozen-lockfile

    - name: Run lint
      working-directory: talemate_frontend
      run: pnpm lint

    - name: Run tests
      working-directory: talemate_frontend
      run: pnpm test
