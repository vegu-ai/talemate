    description: Neutral, clear and easy-to-read prose with no genre flavour.
    favorite: false
    group: talemate_default_467c7fe3
    instructions: 'Write clear, natural prose that is easy to read.

      - Keep the point of view, tense and tone the story already uses. Add no genre,
      period or narrator flavour of your own.

      - Use plain, exact words. Vary sentence length and structure; do not open sentence
      after sentence the same way.

      - Choose the one concrete detail that matters in this moment over general description.
      Do not stack adjectives, similes or metaphors.

      - In narration and dialogue you write, cut filler: do not restate what just happened,
      do not explain a feeling the action already shows, and do not close on a line
      that reflects on the moment or hints at what is to come.

      - In narration and dialogue you write, do not reuse a gesture, image, phrase or
      sentence pattern from the recent text.

      - Dialogue sounds like people talk: contractions, short replies, interruptions,
      words that fit the speaker. Characters do not explain the plot to each other or
      describe their own feelings at length.'
    name: Polished Prose
    phrases: []
    priority: 1
    template_type: writing_style
    uid: ffecb67e-34fe-4aa7-818b-d3270c8e2610
