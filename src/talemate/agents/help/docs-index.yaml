  title: Appearance
  summary: Appearance settings for theme application/app-bar switching, message and markup colors, italic/bold/visibility,
    live preview and Restore from theme. Covers portrait render cadence, visual display sizes, auto-attach, Auto Backdrop,
    Immersive and backdrop panel opacity/text shadow.
- path: user-guide/app-settings/application.md
  title: Connections
  summary: Connections settings group links Clients and Agents, centralizes API keys and shared HuggingFace Token for gated
    model downloads, and manages encrypted environment variables passed to spawned Pi Bridge processes. Covers variable naming,
    adding/editing/removing values and saving changes.
- path: user-guide/app-settings/creator.md
  title: Storytelling
  summary: Storytelling settings manage global Content Classification and Perspective Presets used as scene picker suggestions.
    Covers adding/removing presets, narrative perspective and tense, custom values, and {player_name} substitution or suppression
    when no player character exists.
- path: user-guide/app-settings/game.md
  title: Game
  summary: Application settings navigation, search, Save/Discard, unsaved-edit badges and outside-change warnings; Game controls
    include auto save, auto progress, max backscroll, agent activity bar, release GPU cache on scene load, default player
    character, and persistent sound volume/mute.
- path: user-guide/app-settings/presets.md
  title: Presets
  summary: App-wide Presets settings for action-specific inference categories, memory embeddings through ChromaDB, and System
    Prompts. Explains why all inference presets are used and where global versus per-client prompt overrides are configured.
- path: user-guide/app-settings/system-prompts.md
  title: System Prompt Overrides
  summary: Global and per-client system prompt overrides, client-before-app precedence, nine prompt kinds, Normal/Uncensored
    variants, and pencil indicators. Use {{ system_prompt }} to extend the live built-in default or Apply Default for an editable
    static copy.
- path: user-guide/character-card-import.md
  title: Character Card Import
  summary: Import TavernAI Chara Card V0–V3 PNG/JPG/WebP or JSON through the home dropzone or Scene Library. Covers cast
    detection/manual selection, player templates/actors/scene transfers, case-insensitive name collisions, lore-book
    metadata, alternate greetings, titled episodes, shared world.json, writing styles, cover assets and failed analysis;
    effort-first selectable mode cards pin ongoing scene settings without changing globals, separately from per-step AI
    enrichment, Full/Minimal presets, director attribute limits, card-data fallback and cancel/reopen resets.
- path: user-guide/clients/auto-retry.md
  title: Auto Retry
  summary: Per-client automatic retries for empty responses, HTTP 429 rate limits with exponential backoff, and missing reasoning
    patterns. Covers 0-5 retry sliders, Fail/Ignore behavior, progress notifications, cancellation and the final retry/ignore/cancel
    dialog.
- path: user-guide/clients/client-configuration.md
  title: Client Configuration
  summary: 'Settings → Connections → Clients: add, rename, remove, enable and configure clients, assign one to all agents,
    pin inference parameters, and edit shared API keys. Covers General/Coercion/Advanced/Reasoning/System Prompts sections,
    immutable client types, Save/Discard validation and outside-change warnings.'
- path: user-guide/clients/concurrent-requests.md
  title: Concurrent Requests
  summary: Concurrent requests parallelize visual prompts, image analysis, function-call batches, world-state snapshots/reinforcements
    and character progression. Documents hosted defaults, opt-in Pi Bridge and llama.cpp parallel slots, dual-client progression
    requirements and rate-limit interactions.
- path: user-guide/clients/endpoint-override.md
  title: Endpoint Override
  summary: Override supported remote clients' API endpoints for proxy gateways such as LiteLLM. Configure Base URL and a separate
    proxy API Key in Endpoint Override; explains trusted endpoints and the difference from the official provider key.
- path: user-guide/clients/hibernate.md
  title: Hibernation
  summary: Hibernate unused clients with the power button to reduce client-list clutter while retaining their configuration.
    Click the same button to reactivate a client instead of deleting and recreating it.
- path: user-guide/clients/index.md
  title: Overview
  summary: Overview of local and hosted AI clients, assigning specialized models to agents or sharing one client, and supported
    provider/OpenAI-compatible setup guides. States the reasoning, structured-output and context expectations for models and
    links the bundled Model Testing Harness for qualification.
- path: user-guide/clients/model-testing-harness.md
  title: Model Testing Harness
  summary: 'Bundled Model Testing Harness scene runs six minimum-viability checks on assigned agent clients: tagged instructions,
    JSON/YAML data, conversation, narration, FOCAL function calling and multi-step problem solving. Covers loading, automatic
    execution, result banners, failure diagnosis and rerunning by reloading.'
- path: user-guide/clients/presets.md
  title: Inference Configuration
  summary: Inference preset categories and per-client groups; temperature, top-p/top-k/min-p, penalties, Extra Stopping Strings,
    XTC, DRY, smoothing and Adaptive-P with backend support. Covers Apply to all/Reset, group assignment and copying, plus
    the pinned inference parameter panel for automatic saving during play.
- path: user-guide/clients/prompt-templates.md
  title: Prompt Templates
  summary: Select and troubleshoot model-specific prompt templates for local clients, including the yellow Alpaca fallback
    warning and Determine via HuggingFace lookup order. Covers immediate per-model selection, Lock Template, Manage Templates
    and user templates under templates/llm-prompt/std/user/.
- path: user-guide/clients/rate-limiting.md
  title: Rate Limiting
  summary: Limit a client's requests per minute through the Advanced Rate Limit slider. Explains the wait-or-abort popup,
    reset countdown and generation cancellation, and distinguishes this client-side cap from HTTP 429 Auto Retry handling.
- path: user-guide/clients/reasoning.md
  title: Reasoning Model Support
  summary: Covers enabling reasoning, token budgets, strip and validation patterns, gpt-oss/gemma-4/think presets, missing-pattern
    behavior, Fail/Ignore and retries, Reason Prefill, coercion and model compatibility. Also explains per-action overrides
    from Prompt Manager or Debug Tools, the management dialog's observed actions, client support states and four entry points,
    model limitations and Test Changes exceptions.
- path: user-guide/clients/recommended-models.md
  title: Recommended Local Models
  summary: Guidance for choosing local models, with an external benchmark in place of a maintained recommendation list. Advises
    at least 7B and unquantized 7B/8B where possible, then qualifying a candidate with the bundled Model Testing Harness.
- path: user-guide/clients/response-length.md
  title: Response Length Enforcement
  summary: 'Response Length Enforcement combines API max_tokens caps and prompt length instructions: Limit tokens and send
    instructions, Limit tokens, Send instructions or Uncapped. Includes token-to-paragraph guidance and configuration in the
    client''s Advanced section.'
- path: user-guide/clients/section-format.md
  title: Section Format
  summary: Per-client Section Format chooses Markdown headings or uppercase paired XML tags for prompt sections; Talemate
    decides defaults to Markdown. Covers the Advanced dropdown, Save and sidebar format tag, with content and section ordering
    unchanged.
- path: user-guide/clients/template-locking.md
  title: Template Locking
  summary: Lock a client's prompt template across model changes, including separate reasoning and non-reasoning variants.
    Covers enabling Lock Template, selecting the template after the checkbox clears it, saving, lock indicators and restoring
    automatic HuggingFace detection.
- path: user-guide/clients/types/anthropic.md
  title: Anthropic Client
  summary: Configure an Anthropic client with the shared API key, model identifier and context length; manually enter models
    absent from the dropdown. Covers ready-state indicators and Concurrent Inference, enabled by default for batch requests.
- path: user-guide/clients/types/cohere.md
  title: Cohere Client
  summary: Configure a Cohere client with its shared API key, model and context length, then save and verify the ready indicator.
    Supports manual model identifiers when the available-model list lags behind the provider.
- path: user-guide/clients/types/deepseek.md
  title: DeepSeek Client
  summary: Configure the DeepSeek client, API key, context length and deepseek-chat or deepseek-reasoner model. For reasoning
    models, enable Reasoning and allocate thinking tokens to avoid empty or minimal visible responses.
- path: user-guide/clients/types/google.md
  title: Google Client
  summary: Configure a Google Gemini client, shared API credentials, model identifier and context length. Covers manual model
    entry, Concurrent Inference enabled by default, ready-state indicators and Disable Safety Settings.
- path: user-guide/clients/types/groq.md
  title: Groq Client
  summary: Configure a Groq client using the shared API key, model identifier and context length. Covers missing-key setup,
    Save/ready status and manually entering model names absent from the dropdown.
- path: user-guide/clients/types/koboldcpp.md
  title: KoboldCpp Client
  summary: KoboldCpp connection setup, United API versus /v1 OpenAI mode, sampler support including XTC/DRY/Adaptive-P, and
    prompt-template troubleshooting. Explains automatic Visual Agent setup and capability-based TTS backend registration,
    disable/re-enable lifecycle, preserved settings and Automatic Setup opt-out.
- path: user-guide/clients/types/llamacpp.md
  title: llama.cpp Client
  summary: Connect to llama-server at port 8080 with optional API authentication, context length and local prompt templates.
    API handles prompt template uses /apply-template while retaining coercion and thinking controls; Concurrent Inference
    requires server parallel slots and is off by default.
- path: user-guide/clients/types/lmstudio.md
  title: LMStudio Client
  summary: Connect Talemate to LMStudio's local server at port 1234, with optional API key and context length. Troubleshoots
    prompt-template quality and connection failures, including the requirement to start the server inside the LMStudio application.
- path: user-guide/clients/types/mistral.md
  title: Mistral.ai Client
  summary: Configure Mistral.ai/MistralAI with a shared API key, model and context length, including manual model identifiers.
    Concurrent Inference is enabled by default, while actual batch parallelism depends on the account's rate limits.
- path: user-guide/clients/types/ollama.md
  title: Ollama Client
  summary: Configure an Ollama client at port 11434, pull and select a local model, and refresh the model catalog by saving.
    Covers API handles prompt template, Allow thinking, missing-model/offline indicators and template troubleshooting.
- path: user-guide/clients/types/openai-compatible.md
  title: OpenAI Compatible Client
  summary: 'Use an OpenAI Compatible API client for services such as DeepInfra: API URL/key, manual model name, context length
    and server-side chat templates. Parameters toggles omit temperature, top_p or presence_penalty, and troubleshooting distinguishes
    an empty URL from later generation failures.'
- path: user-guide/clients/types/openai.md
  title: OpenAI Client
  summary: Configure an OpenAI client with a shared API key, model and context length, with Concurrent Inference enabled by
    default. Explains enabling Reasoning and increasing Reasoning Tokens for o1/o3/gpt-5 models that return empty or short
    answers.
- path: user-guide/clients/types/openrouter.md
  title: OpenRouter Client
  summary: Configure OpenRouter with its shared API key, dynamically fetched model catalog, context length and default concurrent
    requests. Covers refreshing models on Save and omitting unsupported temperature, top-p/top-k/min-p and penalty parameters
    through individual toggles.
- path: user-guide/clients/types/pi-bridge.md
  title: Pi Bridge Client
  summary: Explains how Talemate launches isolated pi coding-agent RPC processes as an LLM bridge while disabling coding tools
    and project context. Covers installation, pi-owned credentials and custom providers, encrypted environment variables,
    model/thinking/concurrency settings, Docker persistence, and stream tracing.
- path: user-guide/clients/types/tabbyapi.md
  title: TabbyAPI Client
  summary: Connect a TabbyAPI server with URL, API key and context length. Covers optional API handles prompt template for
    chat/completions, Talemate template control, model readiness and connection troubleshooting including incorrect credentials.
- path: user-guide/clients/types/text-generation-webui.md
  title: Text-Generation-WebUI Client
  summary: Connect Text-Generation-WebUI/ooba with URL, optional API key and context length. API handles prompt template enables
    chat/completions with continue_ coercion and automatic reasoning extraction; covers missing models, template quality and
    connection failures.
- path: user-guide/debug-tools.md
  title: Debug Tools
  summary: 'The bug-icon Debug Tools panel covers Prompts, Memory and Vars: inspect sent prompts and disable reasoning per
    action, watch memory retrieval, and edit game-state variables or the full scene-state JSON. Pin labeled paths independently
    to Debug Vars or scene toolbar knobs, with descriptions, order, read-only controls, number bounds and sliders, string
    choices, type-matched controls, path subtitles and three routes to the Game State editor.'
- path: user-guide/howto/create-a-new-scene/create-empty-scene.md
  title: Create an empty scene
  summary: Create New Story from Home, name it, choose writing style/director persona, set knowledge effort, select Standard or
    Character perspectives from compact cards, and optionally request Director assistance. Set the outline and save; mode can
    change in Scene Settings only while history and archived history are empty.
- path: user-guide/howto/create-a-new-scene/create-npc.md
  title: Add an AI controlled character
  summary: Add an AI-controlled NPC through Create Character with AI Generation Instructions and optional example dialogue.
    Refine attributes and generate Actor acting instructions to establish consistent speech and behavior, then save the scene.
- path: user-guide/howto/create-a-new-scene/create-player-character.md
  title: Add the player character
  summary: Create the player character in World Editor → Characters using AI generation, a name and descriptive instructions.
    Enable Controlled by Player, save the scene, and continue the tutorial by adding an AI-controlled character.
- path: user-guide/howto/create-a-new-scene/test.md
  title: Test your scene
  summary: Test the new Forgotten House scene after adding player and AI characters. Leave World Editor and switch Creative
    mode to Play so normal scene progression and player input become active.
- path: user-guide/howto/infinity-quest-dynamic/1-create-the-scene-project.md
  title: 1 - Scene Project
  summary: 'Infinity Quest Dynamic tutorial setup: create a scene project, import and activate Elmer and Kaira, then lock
    the save and set a restoration file. Also covers disabling auto progress while building and testing the scene.'
- path: user-guide/howto/infinity-quest-dynamic/2-initial-nodes.md
  title: 2 - Initial Nodes
  summary: Extend the default Scene Loop and hook a custom On Scene Init event module to scene_loop_init. Generate/set an
    introduction, organize nodes into groups, and use game.intro_generated with Get/Set State and Switch to run initialization
    only once.
- path: user-guide/howto/infinity-quest-dynamic/3-improvements.md
  title: 3 - Improvements
  summary: Improve the dynamic premise generator with Contextual Generate for scene intros, staged reset controls, and clearing
    old introductions before regeneration. Generate a thematic list, pick a random theme, format instructions and inspect
    the result with a Watch node.
- path: user-guide/howto/infinity-quest-dynamic/4-get-organized.md
  title: 4 - Get organized
  summary: Refactor the Infinity Quest premise-generation chain into a reusable Generate Premise submodule. Clean up automatically
    created input/output sockets, replace the original chain, expose the selected theme, apply Module Style and test with
    a Watch node.
- path: user-guide/howto/infinity-quest-dynamic/5-agentic-workflow.md
  title: 5 - Agentic Flow
  summary: 'Build a three-stage Creator/Summarizer workflow: choose a theme, analyze it, then generate an introduction informed
    by that analysis. Pass local state between stages, construct Jinja2 prompts with Prompt from Template/Generate Response,
    inspect debug logs and test the scene loop.'
- path: user-guide/howto/infinity-quest-dynamic/6-reusable-module.md
  title: 6 - Reusable Module
  summary: Turn the scene-specific premise generator into reusable Dynamic Premise modules by exposing reset, topic, analysis_enabled
    and analysis_instructions properties. Propagate inputs through submodules, revise registry paths and prompts, then share
    files through templates/modules/ with scene-local overrides.
- path: user-guide/howto/infinity-quest-dynamic/7-polish.md
  title: 7 - Polish
  summary: Polish the Dynamic Story generator using Emit Status, comments, function-based Error Handler and Unpack Exception,
    including GenerationCancelled routing. Add story-intention generation and default scene_loop_init registration with labeled
    module properties.
- path: user-guide/howto/infinity-quest-dynamic/index.md
  title: Building a Dynamic Story Generator with the Node Editor
  summary: Seven-part Infinity Quest Dynamic tutorial builds a random story-introduction generator and reusable Dynamic Storyline
    module. Teaches scene setup, event hooks, theme selection, submodules, staged Creator/Summarizer analysis, package reuse,
    status feedback and error handling.
- path: user-guide/howto/use-dynamic-story-module/index.md
  title: Use the dynamic story module
  summary: Install and configure the Dynamic Storyline mod to randomize a scene introduction once. Preserve a locked foundation
    save, set the topic, intro token length and optional topic analysis instructions, then reload in gameplay mode to generate
    a fresh premise.
- path: user-guide/inline-visuals.md
  title: Inline Visuals
  summary: Generate and manage inline scene illustrations, backgrounds, cards and character portraits, including Visualize
    on context-investigation messages and image click shortcuts. Covers auto-attachment, render cadence/size, Scene Backdrop,
    Auto Backdrop and the Immersive toggle.
- path: user-guide/integrations/runpod.md
  title: Runpod
  summary: 'Legacy RunPod integration guide for remotely hosted Text-Generation-WebUI: API keys, Community/Secure Cloud, storage,
    TheBloke template and pod-name discovery. Notes the RunPod settings category no longer exists and explains dashboard status,
    stopping pods and connecting to port 7860.'
- path: user-guide/interacting.md
  title: Interacting with the scene
  summary: 'Scene interaction syntax and shortcuts: quoted dialogue, asterisk actions, Tab act-as, @ quick actions, #/## director
    nudges and Ctrl+Enter autocomplete. Covers auto progress, cancellation, Continue, and selecting Original/Regenerated/Revised/Continued
    message versions that become active scene text. Analyze perceptions (Character perspectives) or Refresh facts (Standard),
    the next sent line, or a choice updates stale knowledge; pointer movement, keyboard focus and tab changes stay browsing.'
- path: user-guide/node-editor/core-concepts/collector_nodes.md
  title: Collector Nodes
  summary: Dict/List Collector nodes aggregate dynamic inputs with key inference or Make Key-Value Pair tuples, ordered lists
    and nested structures. Covers adding/removing sockets and formatting collected data with Python-style Advanced Format
    versus Jinja2 Format loops, filters and conditionals.
- path: user-guide/node-editor/core-concepts/command_module.md
  title: Command Modules
  summary: Create automatically registered Command modules invoked as !command:arg_0;arg_1, with function arguments and scene
    actions. Configure icons and menu groups for scene tools, typed argument dialogs, blank-value omission and immediate registration
    after saving the module.
- path: user-guide/node-editor/core-concepts/error-handling.md
  title: Error Handling
  summary: Catch graph exceptions with Error Handler and an exc-argument function, then inspect exception name/message with
    Unpack Exception. Shows Define/Get Function wiring and emitting scene status for graceful recovery or error-specific routing.
- path: user-guide/node-editor/core-concepts/events.md
  title: Events
  summary: Create Event modules that listen to named Talemate signals and read or mutate emission payloads. Activate through
    the scene loop or saved auto_register/event_name properties; includes injecting Dynamic Instructions into director choice
    generation and typed TTS emission helpers.
- path: user-guide/node-editor/core-concepts/functions.md
  title: Functions
  summary: Build inline functions or reusable Function Modules with Argument, Return, Define/Get/Call Function and Call For
    Each. Explains shared state and error handling, then exposes typed callbacks to AI through FOCAL, prompt schemas/examples,
    retries and Process AI Function Call results.
- path: user-guide/node-editor/core-concepts/modularity.md
  title: Modularity
  summary: Compose reusable visual node modules from Python nodes, including Module, Command, Event, Function and Scene Loop
    types. Documents scene → public templates → built-in load precedence and promoting scene modules to templates/modules/
    with Copy/Move, registry and project-folder controls.
- path: user-guide/node-editor/core-concepts/module-inheritance.md
  title: Module Inheritance
  summary: Extend visual node modules through Extend current and the extends property to inherit live references to locked
    base nodes, edges, groups and comments. Compares update-propagating extensions with independent copies and explains adding
    custom logic without modifying the base.
- path: user-guide/node-editor/core-concepts/package.md
  title: Installable Packages
  summary: Package node modules for installation through the World Editor Mods list. Covers Package metadata and scene-loop
    restart, Install Node Module, Promote Config fields/requirements, and distributing package/module files under templates/modules/
    so users need no node-editor setup.
- path: user-guide/node-editor/core-concepts/prompt-templates.md
  title: Prompt Templates
  summary: Construct Jinja2 node prompts using Prompt from Template, Template Variables and Generate Response, from mutually
    exclusive inline or file sources. Covers scene/agent scopes, token-budgeted context includes, structured JSON/YAML output,
    examples and the per-node dedupe override.
- path: user-guide/node-editor/core-concepts/prompt_building.md
  title: Prompt Building
  summary: Build Prompt assembles contextual agent prompts with automatic token budgeting, scene intent/history, extra context,
    RAG memory, characters and game state. Covers Dynamic Instructions, memory_prompt socket/property precedence, compatible
    common/base templates, reserved_tokens, prefills and dedupe_enabled overrides.
- path: user-guide/node-editor/core-concepts/staging.md
  title: Staging
  summary: Stage nodes control graph execution priorities, including negative stages, equal-priority branches and unstaged
    outputs running last. Documents unchanged state passthroughs, unconnected=True outputs, local state between stages, lowest-marker
    priority and the X shortcut for adding a stage.
- path: user-guide/node-editor/core-concepts/states.md
  title: State Management
  summary: State nodes read/write/unset/check/count values in local, parent, shared, scene loop and persistent game scopes,
    with conditional variants. Explains agent scene/context lifetimes, resets, sharing between stages, game-state-driven context
    pins and debugging variables.
- path: user-guide/node-editor/core-concepts/switches.md
  title: Switches and conditional routing
  summary: Conditional routing with Switch, RSwitch/RSwitchAdvanced, OR/AND routers, Case, Invert and Coallesce. Documents
    Talemate truthiness (None/False/UNRESOLVED are falsy), pass_through, grouped flags, exact/attribute case matching and
    fallback branch patterns.
- path: user-guide/node-editor/core-concepts/user-interface.md
  title: Using the node editor
  summary: 'Node editor UI: module library, creation/copy/extension, locked modules, canvas wiring, groups/comments, testing,
    breakpoints and automatic module sync. Includes Alt+Shift counterparts, W/S/X quick Watch/SetState/Stage creation, X/Y
    alignment, auto-titling, log timestamps and color picker.'
- path: user-guide/node-editor/index.md
  title: Introduction
  summary: Introduction to the node editor for building complex scenes and reusable modules without code. Routes to the node
    registry/socket/property reference, event reference and prompt-template functions.
- path: user-guide/node-editor/reference/events.md
  title: Events
  summary: Reference of supported event names, firing order and mutable payloads for game/scene loops, regeneration and agent
    generation/instruction hooks. Covers creator dialogue examples, editor rewrite compatibility, help chat, summarizer archives/RAG,
    TTS chunk/audio hooks, visual finalization and asset/backdrop changes.
- path: user-guide/node-editor/reference/nodes/agents-conversation.md
  title: Conversation Agent Nodes
  summary: Conversation node reference for Generate Conversation and Conversation Settings, including registry paths, sockets
    and trigger_conversation_generated. Generate dialogue for a character with optional instructions and receive text/CharacterMessage
    outputs for separate insertion into history.
- path: user-guide/node-editor/reference/nodes/agents-creator.md
  title: Creator Agent Nodes
  summary: Creator node reference for Contextual Generate, Create/Generate Character, thematic lists and name/description/acting-instruction/content-context
    derivations. Covers Fast Character Generation, consolidation/fill-in-misses, example-dialogue name requirements and wiring
    generated data to Persist Character without duplicate requests.
- path: user-guide/node-editor/reference/nodes/agents-director-auto.md
  title: Director Auto-Direction Nodes
  summary: 'Director auto-direction node reference: Auto Direction, Determine Scene Intent, Generate Auto Direction and Generate
    Scene Types. Lists sockets/properties, scene-phase outputs and deprecated candidate-selection and Is Due For Instruction
    nodes.'
- path: user-guide/node-editor/reference/nodes/agents-director-chat-actions.md
  title: Director Chat Actions
  summary: Director chat action modules expose assess_visibility, create_image, direct_scene, direct_story_arc, gameplay,
    ooc, query, update_context, update_gamestate and yield_to_user callbacks. Covers Known by visibility assessment on explicit
    request, action descriptions/instructions, concurrency flags, JSON examples and action-summary plumbing.
- path: user-guide/node-editor/reference/nodes/agents-director-chat-instructors.md
  title: Director Chat Instructors
  summary: Director chat instructor module reference for Instruct Character/Narrator, character creation and updates, and
    world/history/game-state/story-configuration changes. Lists registry paths, typed inputs, optional player/active/narration
    controls and summary/update outputs.
- path: user-guide/node-editor/reference/nodes/agents-director-chat.md
  title: Director Chat Nodes
  summary: 'Director chat plumbing reference: ActionArgument, ActionConfirm, DirectorChatSubAction gating, GetDirectorChatContext
    and source-context retrieval. Covers query modules for world/game state/scene direction, character activation, issue reporting,
    confirmation rejection and chat versus scene-direction availability.'
- path: user-guide/node-editor/reference/nodes/agents-director-plan.md
  title: Director Planning Nodes
  summary: Director planning node reference for plan/task CRUD, Create/Critique Outline, Estimate Words, Get Active Plan and
    Expand Story Arc. Covers beat validation, plan statuses, chat-linked plan IDs, perspective/close_arc, chunked prose expansion
    and completed-plan edit restrictions.
- path: user-guide/node-editor/reference/nodes/agents-director.md
  title: Director Agent Nodes
  summary: Director nodes for Persist Character, Assign Voice, Scene Direction, dice rolls, chat insertion, avatar generation,
    action logging, actor/narrator/yield functions and activation handlers. Assess Entry Visibility proposes bounded authored-visibility
    batches; Apply Visibility Assessment consumes confirmed plans and rejects stale batches without revoking learned knowledge.
- path: user-guide/node-editor/reference/nodes/agents-editor.md
  title: Editor Agent Nodes
  summary: Editor node reference for Clean Up User Input, Clean Up Narration and Clean Up Character Message plus settings
    sockets. Covers exposition formatting, balancing quotes, stripping partial sentences/stray dialogue, force overrides and
    command-prefix exemptions.
- path: user-guide/node-editor/reference/nodes/agents-memory.md
  title: Memory Agent Nodes
  summary: Memory node reference for Query Context DB and Unpack Memory Document. Configure semantic queries, metadata filters,
    token budgets, per-query limits and filter/formatter functions, then extract document IDs, raw/text/dict data, metadata
    and context_id.
- path: user-guide/node-editor/reference/nodes/agents-narrator.md
  title: Narrator Agent Nodes
  summary: Narrator node reference for progress, scene/environment descriptions, queries, post-dialogue, character entry/exit
    and time-passage generation. Details text/message outputs, narrative direction and token limits, Auto Narration events
    and deprecated Unpack Source; generated messages need separate history insertion.
- path: user-guide/node-editor/reference/nodes/agents-summarizer.md
  title: Summarizer Agent Nodes
  summary: Summarizer node/module reference for Generate Tags, Summarize Scene Progression, settings sockets, On Message Set
    Avatar and the summarize_scene_progress websocket handler. Lists text/tag, summary/analysis outputs and event registration
    properties.
- path: user-guide/node-editor/reference/nodes/agents-tts.md
  title: Voice Agent Nodes
  summary: Voice/TTS node reference for Generate TTS, Get Voice/Get Narrator Voice and Unpack Voice, plus chunk text manipulation.
    Use Unpack Generation Emission and Set Chunk Text on agent.tts.generate.before to inspect speaker/API/message metadata
    and rewrite text before synthesis.
- path: user-guide/node-editor/reference/nodes/agents-visual-generation.md
  title: Visualizer Agent Generation Nodes
  summary: 'Visualizer generation node reference: GenerationRequest/Generate Image, Backend Status/Select Backend and request/response
    unpacking. Covers references, image-edit versus text-to-image routing, attachment contexts, callbacks, base64 data, and
    concurrent Analyze Images with saved/skipped/failed asset results.'
- path: user-guide/node-editor/reference/nodes/agents-visual-modules.md
  title: Visualizer Agent Modules
  summary: Ready-made visualizer modules generate assets, avatars and portraits, choose references, edit/regenerate images
    and set cover images from generation. Reference includes prompt_only, asset attachment contexts, callbacks and visualize/revisualize/tag-generation
    websocket handlers.
- path: user-guide/node-editor/reference/nodes/agents-visual.md
  title: Visualizer Agent Prompt Nodes
  summary: Visualizer prompt node reference for Prompt/Prompt Part, Apply Style versus configured Apply Styles, Finalize Prompt,
    enums and unpacking positive/negative strings. Covers keyword/descriptive formats, implied negatives, character finalizers,
    required state gating and UNSPECIFIED style behavior.
- path: user-guide/node-editor/reference/nodes/agents-world-state.md
  title: World State Agent Nodes
  summary: World-state node reference for time advancement/chapter titles, character progression suggestions, presence checks,
    sheet extraction and tracked State Reinforcement. Covers Evaluate Query, Request/Emit World State, avatar selection, deactivation
    and websocket handlers with sockets/properties.
- path: user-guide/node-editor/reference/nodes/agents.md
  title: Agent Nodes
  summary: 'Generic agent node reference: Get Agent, Call Agent Function and conditional calls, Dynamic Instruction, Toggle
    Agent Action and Get/Set/Unset/Counter Agent State. Covers scene/context scopes, keyword arguments, counter resets and
    effective scene override behavior when toggling actions.'
- path: user-guide/node-editor/reference/nodes/assets-meta.md
  title: Asset Meta And Selection Nodes
  summary: 'Asset metadata/selection node reference: Make/Unpack Asset Meta, Search Assets tag filters, and Select Assets
    noop fallback versus prioritized chains. Make Asset Attachment Context controls message IDs, auto-attach, replacement/delete_old,
    scene/character covers and current/default avatar overrides.'
- path: user-guide/node-editor/reference/nodes/assets.md
  title: Asset Nodes
  summary: Scene asset nodes to add base64 image data, fetch or list assets, check partial asset IDs, remove assets, set character
    avatars and scene or character cover images, and update message asset attachments with optional override_cadence for manual
    choices.
- path: user-guide/node-editor/reference/nodes/context-id.md
  title: Context ID Nodes
  summary: 'Context IDs address scene context entries generically: Path to Context ID, Context ID Get/Set Value, Character
    Context IDs (attributes, details, acting instructions, example dialogue), Scan and Render Context IDs, Context ID Meta
    Entries, Compress Context ID Part, and Set Pin / Remove Pin / Is Pin Active.'
- path: user-guide/node-editor/reference/nodes/core-functions.md
  title: Function Nodes
  summary: Function nodes define, retrieve and call reusable graphs, pass typed arguments, map Call For Each over collections,
    and return results. Covers Error Handler, Unpack Exception, creative-mode Breakpoint, Scoped API Function with TM, and
    isolated Run Module execution.
- path: user-guide/node-editor/reference/nodes/core-logic.md
  title: Logic Nodes
  summary: Logic nodes branch with Switch, RSwitch, RSwitch Advanced, Case and Case Router; combine conditions with AND/OR
    Router; and invert or create booleans. Documents Coallesce truthiness and Apply Default or As Bool handling of UNRESOLVED
    and None.
- path: user-guide/node-editor/reference/nodes/core.md
  title: Core Nodes
  summary: Core graph nodes define module Input/Output sockets and Module Property interfaces, control execution order with
    Stage, pass values through Route, inspect creative-mode values with Watch, and emit None with Null.
- path: user-guide/node-editor/reference/nodes/data-collections.md
  title: Dict And List Nodes
  summary: Dictionary and list nodes create, collect, combine and mutate collections through dynamic inputs and inferred keys.
    Includes Dict Get Path dotted traversal and defaults, deep-merge Dict Update, Make Key-Value Pair, append/remove/pop operations
    and copy behavior.
- path: user-guide/node-editor/reference/nodes/data-number.md
  title: Number Nodes
  summary: Number nodes create or convert integers and floats, perform arithmetic, compare with tolerance, clamp ranges, sum
    values and calculate mean, median or mode. Includes Min Max with index and Random uniform, integer, normal or choice generation.
- path: user-guide/node-editor/reference/nodes/data-string.md
  title: String Nodes
  summary: String nodes format dynamic inputs with Python-style Advanced Format or Jinja2 Format, create text, change case,
    join/split, trim, replace and test substrings. Includes anchor-based Extract, indexed Substring, Excerpt and Condensed
    whitespace cleanup.
- path: user-guide/node-editor/reference/nodes/data.md
  title: Data Nodes
  summary: General data nodes get or set object attributes, dictionary keys and list indices; update objects from dynamic
    inputs; parse JSON; and generate UUIDs. Includes Contains, Length, Cap Length, Sort and Select Item random/cycle/sorted_cycle/direct
    selection.
- path: user-guide/node-editor/reference/nodes/event.md
  title: Event Nodes
  summary: Event nodes emit agent messages, system messages, scene/status updates and World Editor sync notifications. Documents
    conditional status emission gated by graph state and the Event node for accessing the current event inside a Listen module.
- path: user-guide/node-editor/reference/nodes/focal.md
  title: AI Function Nodes (Focal)
  summary: Focal AI function nodes define typed arguments, callback instructions and examples, send callable functions to
    an agent, and unpack or collect call results. Covers max_calls, retries, response length, concurrent callbacks and director
    chat action plumbing.
- path: user-guide/node-editor/reference/nodes/index.md
  title: Node Reference
  summary: Complete node editor reference grouped by category, with registry paths, input/output sockets and properties for
    graph logic, agents, assets, scene history, knowledge, prompts, data, state, events and UX. Explains how registry paths
    identify nodes in search and module JSON.
- path: user-guide/node-editor/reference/nodes/input.md
  title: Input Nodes
  summary: Player input nodes wait for scene-loop messages and process input into cleaned text and interaction state. Documents
    player_character, reason, prefix, ! command handling and abort_condition branches that interrupt the input loop.
- path: user-guide/node-editor/reference/nodes/knowledge.md
  title: Knowledge Nodes
  summary: Knowledge nodes query facts, current state, relationships, visibility and character reports; Facts About ranks
    importance and recency, fact text outputs apply chronology selection and relative time markers, while Relationship Timeline
    raw facts remain oldest first. Perception reports include disclosures and supported-fact access; revokes and awareness
    lines are legacy-only, and Grant Knowledge establishes disclosures with mode-aware director callbacks and confirmation.
- path: user-guide/node-editor/reference/nodes/prompt.md
  title: Prompt Nodes
  summary: Prompt nodes build Jinja2 prompts with scene, character, memory, game state and dynamic context toggles; load templates
    and render text; then Generate Response with token budgets, retries and optional ResponseSpec extraction. Includes prefill,
    deduplication, Template Variables and Clean Response.
- path: user-guide/node-editor/reference/nodes/raise.md
  title: Flow Exception Nodes
  summary: Flow exception nodes stop graph or scene-loop execution, raise InputValueError with field-specific messages, and
    signal ActedAsCharacter turns. Stop supports StopModule, LoopBreak/Continue/Exit, ExitScene, RestartSceneLoop, ResetScene
    and StageExit.
- path: user-guide/node-editor/reference/nodes/response.md
  title: Response Parsing Nodes
  summary: Response parsing nodes assemble ResponseSpec dictionaries with required fields and extract LLM content using anchors,
    after-anchor sections, code blocks, regex, prefix stripping or AsIs. Includes nesting-aware Complex extractors, tracked_tags,
    trim and fallback_to_full.
- path: user-guide/node-editor/reference/nodes/scene-characters.md
  title: Scene Character Nodes
  summary: Scene character nodes fetch by name or player status, list active/inactive characters, create and remove characters,
    and activate or deactivate them. Read/write descriptions, attributes and details with context IDs, unpack character fields,
    or update name, color and sheet data.
- path: user-guide/node-editor/reference/nodes/scene-history.md
  title: Scene History Nodes
  summary: Scene history nodes compile prompt context with token budgets and hidden-message filters, query messages by ID/type,
    and push or pop history. Includes recent character activity and creation, removal, listing and unpacking of static archive
    backstory entries with relative timestamps.
- path: user-guide/node-editor/reference/nodes/scene-intent.md
  title: Scene Intent Nodes
  summary: Scene intent nodes read or set overall intent and current phase, test whether a scene type is active, and create,
    fetch, list or remove scene types. Unpack phase/type names, descriptions and instructions, and read direction_always_on
    or direction_run_immediately settings.
- path: user-guide/node-editor/reference/nodes/scene-messages.md
  title: Scene Message Nodes
  summary: Scene message nodes create character, narrator and director messages, toggle AI context visibility and unpack generation
    metadata. Add Message Version appends canonical text with source/reason while preserving earlier revisions for supported
    message types and auto-prefixing character names.
- path: user-guide/node-editor/reference/nodes/scene-world-state.md
  title: World Entry Nodes
  summary: World entry nodes fetch, save, remove and unpack world information, including metadata, shared status and optional
    pins. Generation Options combines Spices, spice_level and Writing Style instructions to steer content generation.
- path: user-guide/node-editor/reference/nodes/scene.md
  title: Scene Nodes
  summary: Scene lifecycle nodes run Scene Loop or Creative Loop, select actors, trigger turn events, restore scenes and generate
    dynamic storylines. Includes scene/loop state access, title, description, introduction and content classification getters/setters,
    plus Unpack Interaction State.
- path: user-guide/node-editor/reference/nodes/state.md
  title: State Nodes
  summary: State nodes get, set, unset and test named graph variables in local, parent, shared, scene loop and persisted game
    scopes. Includes nested Path variants, conditional mutations, resettable State Counter with reset_cap/new_cycle, and Game
    State variable access.
- path: user-guide/node-editor/reference/nodes/util-packaging.md
  title: Packaging Nodes
  summary: Packaging nodes define installable node-module packages, mark modules with Install Node Module and expose their
    properties through Promote Config. Includes package metadata, restart_scene_loop and the bundled Dynamic Storyline package.
- path: user-guide/node-editor/reference/nodes/util.md
  title: Utility Nodes
  summary: Utility nodes increment dictionary counters, compare strings as plain-text or HTML diffs, extract bulleted/numbered
    lists, and convert time amounts to seconds. Module Style configures node title/color, automatic title and icon when a
    graph is reused as a module.
- path: user-guide/node-editor/reference/nodes/ux.md
  title: UX Nodes
  summary: UX nodes build choice menus, notices and text inputs, then emit and style them with tint, icon, scene colors or
    compact layout. Choice/text interactions support defaults, multi-select, multiline input, cancellation and timeout; notices
    return immediately.
- path: user-guide/node-editor/reference/nodes/validation.md
  title: Validation Nodes
  summary: Validation nodes check existing asset IDs, character names/status, context ID syntax and resolved entries, collection
    containment and set/unset values. Covers placeholder characters, custom error messages and null, UNRESOLVED or blank-string
    handling while retaining valid false/zero values.
- path: user-guide/node-editor/reference/nodes/websocket.md
  title: Websocket Nodes
  summary: Websocket nodes fetch routers, queue frontend responses and signal Operation Done or Failed. Documents action/data
    payloads, status messages, automatic scene saving after successful operations, and signal_only or allow_auto_save controls.
- path: user-guide/node-editor/reference/template_functions.md
  title: Template Functions
  summary: 'Prompt template functions: set_prepared_response/set_data_response scaffolding, disable_dedupe, query_scene, query_memory,
    query_text/query_text_eval, instruct_text, agent_action, agent_config, time_diff, text_to_chunks, count_tokens and llm_can_be_coerced.
    Covers conversions, format/config helpers and the condensed filter preserving paragraph breaks.'
- path: user-guide/node-editor/reference/useful-template-patterns.md
  title: Template Pattern Cheat Sheet
  summary: Jinja2 recipes for scene.context_history token budgets, character sheets, common template includes and bot_token/set_prepared_response/set_data_response
    scaffolding. Memory examples distinguish rag_build_for_author from character rag_build, with memory_prompt overrides,
    legacy bucket/viewer/memory-pass behavior and perception restrictions.
- path: user-guide/playthrough.md
  title: Playthrough Mode
  summary: Playthrough replays existing scene messages with Space/click advance, scrubber, time-passage chapters, restart,
    optional voice narration and auto-advance. Covers remembered progress, read-only scenes, hidden editing tools, and Fork
    from here using revision state or trimmed legacy history.
- path: user-guide/prompts/context-history-review.md
  title: Scene Context History Review
  summary: Scene Context in Prompt Manager previews Scene or an active character using Conversation history selection. Covers
    eligible facts, false markers, existing analysis, archive/layer and fact exclusion reasons with counts and capped samples,
    intro/summary rules, budget cuts, the client context-window default, Refresh and scene-wide Apply; previews make no AI
    requests.
- path: user-guide/prompts/deduplication.md
  title: Prompt Deduplication
  summary: Prompt deduplication removes near-duplicate long lines but is off by default because it can damage structured content
    and prompt caching. Covers the client Deduplicate Prompts toggle, template disable_dedupe(), per-node dedupe overrides
    and the independent condensed filter.
- path: user-guide/prompts/index.md
  title: Prompt Manager
  summary: Prompt Manager browses and edits Jinja2 template groups, override priority and explicit per-template sources, with
    outdated override warnings in Active. Inspect sent prompts, responses, reasoning, tokens and cache ratio, test edits,
    or open LLM Prompt Templates and Scene Context review.
- path: user-guide/prompts/llm-prompt-templates.md
  title: LLM Prompt Templates
  summary: 'Manage local-model chat-format wrappers such as ChatML, Llama3, Mistral and Gemma4 in LLM Prompt Templates: create
    user templates, copy built-ins, edit/delete and assign to clients. Covers GGUF/llama.cpp Jinja compatibility variables,
    thinking controls and user/ template storage.'
- path: user-guide/prompts/redefining-response-extraction.md
  title: Redefining Response Extraction
  summary: Customize response extraction in Jinja2 templates with set_anchor_extractor, set_as_is_extractor or set_after_anchor_extractor.
    A dialogue/analysis example covers nesting-aware tracked_tags, case-insensitive markers, fallback_to_full and additive
    mod_response_length token budgets.
- path: user-guide/prompts/volatile-context-placement.md
  title: Volatile Context Placement
  summary: Optimize for Prompt Caching moves volatile RAG, dynamic notes and other changing context after scene history to
    preserve stable prompt prefixes. Covers the client Advanced toggle, per-agent Auto/On/Off overrides, before_history/after_history
    behavior and model suitability.
- path: user-guide/restoring-scenes.md
  title: Restoring Scenes
  summary: Restore scenes through Timeline revision previews and Fork to new save, or reset to a configured restore-point
    save. Covers entry points from messages, Quick load and Scene Library, shared-context disconnection, chain-health Repair
    with archived old deltas, and historical world-state reconstruction limits.
- path: user-guide/saving.md
  title: Saving
  summary: Save scenes as JSON files within a project from scene tools or World Editor, toggle Auto Save, unlock a read-only
    starting save, and create checkpoints with Save As. Includes automatic changelog history, restore-point saves and message
    Fork opening the Timeline.
- path: user-guide/scenario-tools.md
  title: Scene Tools
  summary: Scene toolbar reference for agent activity, regenerate/nuke with Ctrl or Ctrl+Alt direction, Actor/Director/Narrator
    actions, custom time jumps, tracked states, snapshot updates, character creation, Custom Commands, saving and visual generation.
    Covers Auto Save/Progress, Immersive/Playthrough quick settings, reusable shortcuts and shortcut templates.
- path: user-guide/scene-browser.md
  title: Home Screen & Scene Library
  summary: Home screen and Scene Library manage Quick load cards, project/save trees, character cards, filtering and scene
    or ZIP imports, plus blank-scene creation. Covers Timeline menus, removing recent cards, protected loaded saves, project
    deletion and deprecated shipped scenes such as Simulation Suite.
- path: user-guide/scene-directory.md
  title: Scene Directory Structure
  summary: Scene projects under scenes/ group JSON saves with assets, changelog base/latest snapshots and deltas, node graphs,
    prompt templates, shared-context files and info. Explains immediate directory creation, backups, sharing and browsing
    or deleting projects through Scene Library.
- path: user-guide/scene-state-reset.md
  title: Reset Scene State
  summary: Reset Scene State selectively rebuilds Context DB/RAG, clears history with optional static-backstory preservation,
    resets intent/phase tracking, removes agent caches by agent or key, and deletes chosen reinforcements. Includes entry
    counts, confirmation and reset use cases for stale context.
- path: user-guide/templates/attribute.md
  title: Character Attribute
  summary: Create Character Attribute templates for traits, skills or properties, set attribute names and generation priority,
    and write character_name/player_name instructions. Covers spice and writing-style support, favorites, applying in the
    attribute editor, automatic edits and deletion.
- path: user-guide/templates/detail.md
  title: Character Detail
  summary: Create Character Detail templates from questions or statements to generate backstory, flaws, traits or skills.
    Covers character_name/player_name instructions, spice and writing-style support, favorites and applying, editing or deleting
    templates from groups.
- path: user-guide/templates/groups.md
  title: Groups
  summary: Organize reusable world-state templates in groups containing multiple template types; create groups with a name,
    author and description, or remove a selected group from the Templates sidebar.
- path: user-guide/templates/index.md
  title: Templates
  summary: 'Overview of reusable template groups and types: character attributes/details, spices, writing styles, state reinforcements,
    scene types, visual styles/finalizers, agent personas, shortcuts and themes. Covers help-chat template creation permission,
    locked/shipped groups and unsaved editor conflicts.'
- path: user-guide/templates/scene-tool-shortcut.md
  title: Scene Tool Shortcuts
  summary: Create and share Scene Tool Shortcut templates with action, label, valid Material Design icon and standing instructions.
    Install from templates or scene menus as independent application-wide copies, avoid duplicates, handle unavailable actions
    and share group files under templates/world-state.
- path: user-guide/templates/scene_type.md
  title: Scene Types
  summary: Create Scene Type templates containing descriptions and director instructions for style and pacing, mark favorites,
    and import them into World Editor Scene Direction. The documented scene-type behavior is an early work in progress for
    broader rules and constraints.
- path: user-guide/templates/spice.md
  title: Spice Collection
  summary: Spice Collection templates inject a randomly chosen {spice} into generation instructions to add variation. Create
    or AI-generate spice lists, select the collection in Generation Settings, tune its application chance and use it for character
    attributes or details.
- path: user-guide/templates/state.md
  title: State Reinforcement
  summary: State Reinforcement templates define tracked questions for all characters, player, NPCs or world, with context
    attachment, update cadence and extra instructions. Covers automatic creation on new games/characters, favorites and applying
    or maintaining templates in the character States tab.
- path: user-guide/templates/themes.md
  title: Themes
  summary: Author and share Theme templates with 51 color slots across Surfaces, App, Messages and Chats, clickable preview/eyedropper,
    Light/Dark mode, code editor themes and message styling. Covers Apply, live colors versus copied styling, overrides, Reset
    to template, locked shipped themes and help-chat permissions.
- path: user-guide/templates/visual-finalizer.md
  title: Visual Prompt Finalizer
  summary: Visual Prompt Finalizer templates package ordered exact, fuzzy, regex or AI post-processing actions for image prompts.
    Includes the shipped Ideogram JSON preset and insertion as editable copies through Visualizer Prompt Finalization, plus
    template creation, editing and removal.
- path: user-guide/templates/writing-style.md
  title: Writing Styles
  summary: Writing Style templates steer generated tone and define unwanted phrases for Editor revision through regex or semantic-similarity
    matching, with Active toggles and embedding cost considerations. Covers scene assignment for phrase detection, Generation
    Settings selection and Alt-click rewrites.
- path: user-guide/time-passage.md
  title: Time Passage Management
  summary: Insert, edit or delete time-passage markers using Scene Tools presets/custom durations, scene messages or World
    State Manager history. Covers chapter titles for Playthrough navigation, timestamp recalculation, fixed 30-day months/365-day
    years, summarization boundaries and cleared actor directions.
- path: user-guide/tracking-a-state.md
  title: Tracked states
  summary: Tracked states periodically reinforce character or world facts such as physical condition, location or time of
    day. Covers editor access, value inspection and favorite templates, plus Passive relevance, Sequential history, Conversation
    Context and All Context attachment methods.
- path: user-guide/visual-library.md
  title: Visual Library
  summary: Visual Library manages generated images in Queue and shared Scene Assets, with Prompt/Instruct modes, reference
    images, iteration, regeneration, uploads and visual types. Covers covers/backdrops, non-destructive cover crops, reference
    eligibility, analysis, Sync from Analysis tags and backend requirements.
- path: user-guide/voice-library.md
  title: Voice Library
  summary: Voice Library manages global and scene TTS voices, provider status, WAV cloning, Kokoro mixtures, Pocket TTS samples/catalog
    and manually entered OpenAI Compatible voices. Covers tags/search and Director/manual character assignments; available
    from the app-bar voice icon when the Voice agent is enabled.
- path: user-guide/world-editor/characters/actor.md
  title: Actor management
  summary: AI character Actor management defines dialogue instructions and example lines, generates them with Ctrl-click guidance
    and autocompletes examples with Ctrl/Cmd+Enter. Covers straight-quote normalization for speech parsing and TTS, plus {...}
    hints and Redo/Undo.
- path: user-guide/world-editor/characters/attributes.md
  title: Attributes
  summary: Character Attributes editor adds, edits and removes short trait descriptions and generates one or multiple attributes
    from templates or whole groups. Changes apply automatically, with manual scene saving needed when Auto Save is off.
- path: user-guide/world-editor/characters/create.md
  title: Character creation
  summary: 'Reference for the Create New Character dialog in the World Editor''s Characters tab, field by field: Enable AI
    Generation, AI Generation Instructions, Name, Description, Generate Attributes, Generate Example Dialogue and Controlled
    by Player. Mentions the Creator agent''s Fast Character Generation mode.'
- path: user-guide/world-editor/characters/deactivate.md
  title: Activate and Deactivate Characters
  summary: Activate or deactivate characters temporarily to include or exclude them from dialogue generation. World Editor
    changes are immediate without narration, while Scene Tools and the World panel can narrate departures and returns.
- path: user-guide/world-editor/characters/delete.md
  title: Delete character
  summary: Delete a character from World Editor Characters by selecting the portrait Delete action and confirming with the
    character name.
- path: user-guide/world-editor/characters/description.md
  title: Description
  summary: Edit a character description covering appearance, personality, background and motivations in World Editor Characters,
    with Generate and autocomplete support. Changes apply while typing; save the scene manually if Auto Save is disabled.
- path: user-guide/world-editor/characters/details.md
  title: Details
  summary: Character Details editor manages longer background facts or questions, generates individual/multiple templates
    or groups, and links changing details to Setup Auto State. Includes tracked-state updates, Add pin/View pin for persistent
    AI context, editing and removal.
- path: user-guide/world-editor/characters/folders.md
  title: Folders
  summary: Organize the character sidebar into collapsible folders with member/active counts, 29-character names, immediate
    assignment and bulk rename. Covers remembered expansion, ungrouped characters and folder synchronization for characters
    shared through world context.
- path: user-guide/world-editor/characters/import.md
  title: Import character
  summary: 'Import characters from another Talemate scene through World Editor Characters: choose Import character, select
    the source scene and character, and import into the current scene. The character arrives inactive, and an import is refused
    with "Name X already exists." when the scene already holds that name, compared without case.'
- path: user-guide/world-editor/characters/index.md
  title: Character Editor
  summary: Character Editor overview for creating/removing characters, switching player control, activation and folder organization.
    Links character attributes, details, description, tracked states, Actor management and visual portraits with automatic
    context-based selection.
- path: user-guide/world-editor/characters/player.md
  title: Make or Unmark a Player Character
  summary: Make Player Character promotes an existing character, demotes the previous player to AI and activates an inactive
    choice. Unmark as Player hands control back to AI while preserving the character and leaves the scene without a player
    until one is chosen.
- path: user-guide/world-editor/characters/states.md
  title: Tracked states
  summary: Create character tracked states from questions in the States tab with immediate initial generation, update-every-N-turn
    cadence and context attachment. Add generation instructions, Refresh State for an update, or Reset State to discard bad
    accumulated state and generate afresh.
- path: user-guide/world-editor/characters/visuals.md
  title: Character Visuals
  summary: Character Visuals manages cover images, default/current portraits, uploads, new generation and reference/batch
    variations. Covers portrait tags and automatic World State selection, permanent Static Visual Rules, character-specific
    prompt finalization and required image backends.
- path: user-guide/world-editor/context-db.md
  title: Context DB
  summary: Browse and search the Memory Agent context database using embedding relevance; adjust Search Strictness from 0.1
    to 2.0 via the active preset distance_mod. Covers persisted search tuning, preferred World/Characters editing and Reset
    reimport with loss of manually added database-only entries.
- path: user-guide/world-editor/facts.md
  title: Facts
  summary: World Editor Facts tab lists every recorded fact with source, topic, audience (who knows it and how), supersedes
    arrows and a False chip. Combinable filters (text, character knows/does not know/is a subject, topic, importance, source,
    superseded, false, latest chapter), sorting and paging; row actions (edit, mark false, set or clear supersedes, grant
    or block in Standard mode, inspect source, remove) and selection actions (delete, mark false or true, grant) as one request
    each.
- path: user-guide/world-editor/generation-settings.md
  title: Generation Settings
  summary: World Editor Generation Settings apply one-off Ctrl/Cmd-click instructions, Alt-click rewrites, Ctrl+Alt guided
    rewrites and session-remembered length per content type (8–1024 tokens). Covers writing styles, spice collections/chance
    and history-entry seed instructions, excluding live dialogue/narration.
- path: user-guide/world-editor/history/index.md
  title: History
  summary: World Editor History manages static backstory, archived summaries, layered history, presence chips and time-passage
    chapters. Facts show Routine/State/Milestone importance, relative time such as (21 Days ago) since their latest restatement,
    repeats and supersedes links; archived and Dialogue facts share text/importance editing and Known by filtering, source
    inspection and cleanup, and failed extraction retries; History retains the full record despite prompt chronology cuts
    and supports dated seed-guided entries and regeneration.
- path: user-guide/world-editor/history/layered-history.md
  title: Layered History
  summary: Layered History compresses dialogue into base summaries and successively smaller layers to preserve a full-timeline
    detail gradient. Covers compression statistics, token thresholds, layer limits, chunking/analyzation settings, edit/regenerate/inspect
    tools and context-budget review.
- path: user-guide/world-editor/knowledge-how-it-works.md
  title: How character knowledge works
  summary: Five diagrams explain reply inputs, presence, perceptions, disclosures, shared facts, chronology and effort, with
    stops from Off to Ultra. Covers citation not supported, private competitor vetoes, public citations, regenerate old views,
    Scene Context, memory ranking and exclusion, intro audiences, browsing revisions before keeping a version, live character-entry
    orientation and briefing/Offscreen Life coordination, and a mode decision tree that weighs model, secrets, cast size and cost.
- path: user-guide/world-editor/knowledge.md
  title: Knowledge
  summary: Standard versus Character perspectives, mode-specific effort stops and costs, creation scene pins, entry orientation,
    visibility, disclosures, Allow/Block rules, topics and retrieval. Covers mode selection in New Story/card import, origins
    and group/whole-hub Use global settings resets; saves share overrides by settings-file link, while independent creations
    can use different files within a project.
- path: user-guide/world-editor/pins.md
  title: Pins
  summary: Pins keep context entries or character details in AI prompts, with manual activation, AI yes/no conditions and
    turn-based decay. Game State conditions use slash paths, comparison operators and AND/OR groups for immediate deterministic
    activation, overriding manual toggles, AI checks and decay.
- path: user-guide/world-editor/scene/direction.md
  title: Direction
  summary: Scene Direction defines overall story intention, current phase intention and scene type for narrator and director
    guidance; both intentions are required for autonomous direction. Includes scene-specific Director Instructions versus
    global Custom Instructions and reusable type templates for style/pacing.
- path: user-guide/world-editor/scene/export.md
  title: Export
  summary: Export a Talemate scene as JSON or a Complete Scene Package ZIP containing assets, nodes, info, templates and per-scene
    agent settings. Set an export name and optionally reset exported progress without affecting the current session; load
    exports from Home.
- path: user-guide/world-editor/scene/game-state.md
  title: Game State
  summary: Game State JSON editor stores persisted game-scope variables and pins labeled paths to Debug Vars or the scene
    toolbar. Control settings provide descriptions, order, read-only, numeric min/max/step sliders and string choices, with
    container inheritance and limits shared by both control surfaces.
- path: user-guide/world-editor/scene/outline.md
  title: Outline
  summary: Scene Outline sets title, content classification, internal description and player introduction with AI generation/autocomplete.
    Explains perspective/tense defaults and player/NPC/narrator overrides, POV presets, {player_name} substitution and suppression,
    fallback semantics and perspective context IDs. Shipped presets show explanatory and sample-prose subtitles, and Ask director
    to set up perspectives opens a new director chat that chooses and writes perspectives from the existing prose.
- path: user-guide/world-editor/scene/settings.md
  title: Settings
  summary: Scene Settings control Character perspectives while history and archived history are empty, with a Compare modes
    popover holding the two mode cards; disabling clears stored perspectives and disclosures. Covers writing style, locked-save
    and experimental flags, restore points, and per-scene Agent settings file Auto-link, None or explicit project-shared overrides
    included in exports.
- path: user-guide/world-editor/scene/shared-context.md
  title: Shared World & Episodes
  summary: Shared World links scenes to shared-context JSON files and synchronizes characters, selected attributes/details,
    world entries, static history and character folders. Create linked scenes or reusable episode introductions, bulk share/unshare
    elements and convert summarized progress to shared world entries.
- path: user-guide/world-editor/scene/visuals.md
  title: Scene Visuals
  summary: Scene Visuals manages background/moment illustrations and scene cards with uploads, batch variations and new generation.
    Set covers or immersive backdrops, toggle rendering or unset a backdrop, and edit per-scene Visualizer Prompt Finalization
    overrides in the linked agent-settings file.
- path: user-guide/world-editor/suggestions.md
  title: Suggestions
  summary: Suggestions collects agent-proposed world changes, currently character changes, for review; request proposals manually
    with Suggest Changes in the character editor.
- path: user-guide/world-editor/world/states.md
  title: Tracked states
  summary: World tracked states monitor non-character facts through a question, optional starting value, update cadence, context
    attachment and generation instructions. Creating a reinforcement generates its current value as a world entry; Reset State
    Reinforcement clears accumulated generation data.
- path: user-guide/world-state.md
  title: World State
  summary: World panel snapshots, tracked states, text-selection details, knowledge-change dots, character states and name
    protection. The knowledge hub shows ranked/time-marked facts, topics, disclosures/access rules, an unlocked mode comparison
    or locked story mode note, knowledge effort and individual settings. Hub changes use scene overrides with exact setting/group/all
    reset icons in a project-shared settings file. Also covers refresh/wipe, activation, cadence and Pin to context.
